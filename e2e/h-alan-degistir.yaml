# h. Alan değiştirme (ders listesi alana göre; doğum yılı değişmez)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
# Sayısal: Türk Dili ve Edebiyatı and Yabancı Dil are not offered.
- assertVisible:
    id: subject-fizik
- assertNotVisible:
    id: subject-edebiyat
- assertNotVisible:
    id: subject-yabanci_dil
- takeScreenshot: h-alan-01-sayisal
- tapOn:
    id: tab-settings
- extendedWaitUntil:
    visible:
      id: settings-yks-area-esit_agirlik
    timeout: 10000
- tapOn:
    id: settings-yks-area-esit_agirlik
- tapOn:
    id: settings-exam-save
- assertVisible:
    id: settings-exam-saved
- assertVisible:
    id: settings-exam-current
    text: "YKS · Eşit Ağırlık"
- takeScreenshot: h-alan-02-ayarlar
# Sınav tarihi saves without a button: a typed date is kept once the field is left (the tap on the
# label closes the keyboard). Two years ahead stays inside the allowed range on any run date.
- scrollUntilVisible:
    element:
      id: settings-exam-date-input
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: settings-exam-date-input
# Typing before the keyboard is up can be lost (see e-deneme).
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "15.05.${new Date().getFullYear() + 2}"
- tapOn:
    id: settings-exam-date
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: settings-exam-date
      text: ".*${new Date().getFullYear() + 2}.*"
    timeout: 10000
- assertVisible:
    id: settings-exam-date-reset
- takeScreenshot: h-alan-02b-sinav-tarihi
- tapOn:
    id: tab-timer
# Eşit Ağırlık: Türk Dili ve Edebiyatı is offered now.
- extendedWaitUntil:
    visible:
      id: subject-edebiyat
    timeout: 10000
- assertNotVisible:
    id: subject-yabanci_dil
- takeScreenshot: h-alan-03-esit-agirlik
# Mock exams: TYT and AYT Eşit Ağırlık only.
- tapOn:
    id: tab-exams
- tapOn:
    id: exams-add
- extendedWaitUntil:
    visible:
      id: exam-kind-AYT_EA
    timeout: 10000
- assertNotVisible:
    id: exam-kind-AYT_SAY
- takeScreenshot: h-alan-04-deneme-turleri
