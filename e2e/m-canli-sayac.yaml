# m. Canlı sayaç (Live Activity: Dynamic Island ve Bildirim Merkezi) + uzakta görünümü + pomodoro
# Kilit ekranı görünümünde ders ve durum metni zorunlu denetlenir (boş çizilen Live Activity akışı
# düşürür); "Sor" kuralıyla uygulamadan 10 sn'den uzun çıkınca etkinliğin kendiliğinden (staleDate →
# isStale) "Uygulamadan çıktın" görünümüne geçtiği de zorunlu denetlenir. Dynamic Island, mola ve
# pomodoro görünümleri yalnız ekran görüntüsüyle kanıtlanır: m-canli-sayac-0x görüntüleri
# artifact'ta elle incelenmelidir (README).
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
- tapOn:
    id: subject-fizik
- tapOn:
    id: timer-start
- extendedWaitUntil:
    visible:
      id: timer-clock
      text: "0:(0[2-9]|[1-5][0-9])"
    timeout: 15000
# Notification Center pulled down over the app (top-left edge) shows the Lock Screen
# presentation. Over the app it only makes the app 'inactive', which is not leaving it: the running
# state is checked here, without racing the 10 s tolerance (on the CI simulator a Home press and
# one swipe alone take more than 10 s, run e2e-ios-35-1).
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
# Maestro has no sleep command: wait for an id that never exists and carry on (optional).
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- takeScreenshot: m-canli-sayac-02-kilit-ekrani
# First Live Activity: iOS asks on the Lock Screen ("Canlı Etkinliklere İzin Verilsin mi?") and
# draws nothing until it is allowed. Text is matched in full, so "İzin Ver" does not hit "İzin Verme".
- tapOn:
    text: "İzin Ver|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- takeScreenshot: m-canli-sayac-02b-izin-sonrasi
# The Lock Screen presentation must show the subject and the status. Maestro does read
# SpringBoard here: in runs e2e-ios-15-2 and 21-1 both checks passed while the Live Activity was
# drawn, and in run 13-1 (App Group entitlement lost, the activity drawn empty) both failed. So a
# blank or missing Live Activity now fails the flow; the screenshots stay the visual evidence.
- extendedWaitUntil:
    visible:
      text: "Fizik"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Çalışıyorsun"
    timeout: 10000
- swipe:
    start: 50%, 99%
    end: 50%, 20%
    duration: 400
# Back in front for sure (the swipe may have gone to the home screen).
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-clock
    timeout: 15000
- runFlow:
    when:
      visible:
        id: away-credit
    commands:
      - tapOn:
          id: away-credit
# Home screen: the system draws the running clock in the Dynamic Island (no app code runs). This
# is leaving the app: with the default rule "Sor" the last update before the app is suspended
# tells the Live Activity where to freeze.
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-01-dynamic-island
# More than 12 s after leaving: the activity went stale 10 s after the background event and shows
# the away presentation by itself (frozen clock, "Uygulamadan çıktın · mola sayılıyor").
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 10000
    optional: true
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
# Taken before the checks: the evidence is there whether they pass or not.
- takeScreenshot: m-canli-sayac-02c-uzakta
- extendedWaitUntil:
    visible:
      text: "Uygulamadan çıktın.*"
    timeout: 10000
- assertNotVisible:
    text: "Çalışıyorsun"
- swipe:
    start: 50%, 99%
    end: 50%, 20%
    duration: 400
# Back to the same process: the time away was longer than 10 s, so "Çalışıyordum" is offered.
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: away-credit
    timeout: 15000
- tapOn:
    id: away-credit
# Paused: the Live Activity freezes at the paused value.
- tapOn:
    id: timer-pause
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-03-mola
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-finish
    timeout: 15000
- tapOn:
    id: timer-finish
- assertVisible:
    id: timer-saved
# Pomodoro: the Live Activity counts the work block down. The finish summary above (saved time,
# optional question count) pushes the timer card down, so scroll to its controls first; a blind
# tap landed on the tab bar (run 37966317434).
- scrollUntilVisible:
    element:
      id: mode-pomodoro
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: mode-pomodoro
- scrollUntilVisible:
    element:
      id: timer-start
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: timer-start
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pomodoro-phase
    timeout: 10000
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-04-pomodoro
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-finish
    timeout: 15000
- runFlow:
    when:
      visible:
        id: away-dismiss
    commands:
      - tapOn:
          id: away-dismiss
- tapOn:
    id: timer-finish
# Finished: the Live Activity is gone from the Dynamic Island.
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-05-bitti
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 15000
