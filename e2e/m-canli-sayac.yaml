# m. Canlı sayaç (Live Activity: Dynamic Island ve Bildirim Merkezi) + uzakta görünümü + pomodoro
# Kilit ekranı görünümünde ders adı zorunlu denetlenir (boş çizilen Live Activity akışı düşürür);
# "Sor" kuralıyla uygulamadan 10 sn'den uzun çıkınca etkinliğin kendiliğinden (staleDate → isStale)
# "Uygulamadan çıktın" görünümüne geçtiği de zorunlu denetlenir. Dynamic Island, mola ve
# pomodoro görünümleri yalnız ekran görüntüsüyle kanıtlanır: m-canli-sayac-0x görüntüleri
# artifact'ta elle incelenmelidir (README).
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
- tapOn:
    id: subject-fizik
- tapOn:
    id: timer-start
- extendedWaitUntil:
    visible:
      id: timer-clock
      text: "0:(0[2-9]|[1-5][0-9])"
    timeout: 15000
# Home screen: the system draws the running clock in the Dynamic Island (no app code runs).
- pressKey: Home
# Maestro has no sleep command: wait for an id that never exists and carry on (optional).
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-01-dynamic-island
# Notification Center (pulled down from the top-left edge) shows the Lock Screen presentation.
# Only with the app in the background: pulled over the app, Maestro reads the app's own screen
# ("Fizik" and "Çalışıyorsun" are on it too) and cannot reach the permission prompt (run e2e-ios-36-1).
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
# A swipe is lost now and then on the CI simulator (run e2e-ios-37-1, retry): pull once more.
- runFlow:
    when:
      notVisible:
        text: "Fizik"
    commands:
      - swipe:
          start: 15%, 0%
          end: 15%, 70%
          duration: 600
      - extendedWaitUntil:
          visible:
            id: e2e-never-present
          timeout: 2000
          optional: true
- takeScreenshot: m-canli-sayac-02-kilit-ekrani
# First Live Activity: iOS asks on the Lock Screen ("Canlı Etkinliklere İzin Verilsin mi?").
# Text is matched in full, so "İzin Ver" does not hit "İzin Verme".
- tapOn:
    text: "İzin Ver|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- takeScreenshot: m-canli-sayac-02b-izin-sonrasi
# The Lock Screen presentation must be drawn with the subject. Maestro does read SpringBoard here:
# in runs e2e-ios-15-2 and 21-1 the checks passed while the Live Activity was drawn, and in run
# 13-1 (App Group entitlement lost, the activity drawn empty) they failed. "Çalışıyorsun" can not
# be checked here: on the CI simulator the Home press and one swipe alone take more than the 10 s
# tolerance (run e2e-ios-35-1), so by now the activity may already show the away presentation.
# o-ayarlar-sayac checks "Çalışıyorsun" on the Lock Screen ("Çalışmaya devam say").
- extendedWaitUntil:
    visible:
      text: "Fizik"
    timeout: 10000
- swipe:
    start: 50%, 99%
    end: 50%, 20%
    duration: 400
# Back to the same process; being away > 10 s turned into an automatic break.
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-clock
    timeout: 15000
- runFlow:
    when:
      visible:
        id: away-credit
    commands:
      - tapOn:
          id: away-credit
# Away, now with Live Activities allowed: leave the app again with the default rule "Sor". The
# last update before the app is suspended says "Uygulamadan çıktın · 10 sn sonra mola
# sayılır" and carries the away fields with a stale date 10 s later, when the activity should
# switch by itself (isStale) to the frozen clock and "Uygulamadan çıktın · mola sayılıyor". The
# simulator did not draw that switch (run e2e-ios-37-1), so the check accepts either text; the
# screenshot shows which one. "Çalışıyorsun" must be gone either way.
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 12000
    optional: true
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
# A swipe is lost now and then on the CI simulator (run e2e-ios-37-1, retry): pull once more.
- runFlow:
    when:
      notVisible:
        text: "Fizik"
    commands:
      - swipe:
          start: 15%, 0%
          end: 15%, 70%
          duration: 600
      - extendedWaitUntil:
          visible:
            id: e2e-never-present
          timeout: 2000
          optional: true
# Taken before the checks: the evidence is there whether they pass or not.
- takeScreenshot: m-canli-sayac-02c-uzakta
- extendedWaitUntil:
    visible:
      text: "Fizik"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Uygulamadan çıktın.*"
    timeout: 10000
- assertNotVisible:
    text: "Çalışıyorsun"
- swipe:
    start: 50%, 99%
    end: 50%, 20%
    duration: 400
# Back to the same process: the time away was longer than 10 s, so "Çalışıyordum" is offered.
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: away-credit
    timeout: 15000
- tapOn:
    id: away-credit
# Paused: the Live Activity freezes at the paused value.
- tapOn:
    id: timer-pause
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-03-mola
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-finish
    timeout: 15000
- tapOn:
    id: timer-finish
- assertVisible:
    id: timer-saved
# Pomodoro: the Live Activity counts the work block down. The finish summary above (saved time,
# optional question count) pushes the timer card down, so scroll to its controls first; a blind
# tap landed on the tab bar (run 37966317434).
- scrollUntilVisible:
    element:
      id: mode-pomodoro
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: mode-pomodoro
- scrollUntilVisible:
    element:
      id: timer-start
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: timer-start
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pomodoro-phase
    timeout: 10000
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-04-pomodoro
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-finish
    timeout: 15000
- runFlow:
    when:
      visible:
        id: away-dismiss
    commands:
      - tapOn:
          id: away-dismiss
- tapOn:
    id: timer-finish
# Finished: the Live Activity is gone from the Dynamic Island.
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: m-canli-sayac-05-bitti
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 15000
