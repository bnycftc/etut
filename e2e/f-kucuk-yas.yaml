# f. 15 yaş altı (Gruplar sekmesi yok, K-16)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-start
    timeout: 60000
# Born 12 years ago: under 15 -> solo-only profile.
- tapOn:
    id: "birth-year-${new Date().getFullYear() - 12}"
- tapOn:
    id: exam-type-LGS
- scrollUntilVisible:
    element:
      id: onboarding-start
    direction: DOWN
    timeout: 20000
- tapOn:
    id: onboarding-start
    retryTapIfNoChange: true
- runFlow:
    file: subflows/ipucu-gec.yaml
- assertVisible:
    id: tab-timer
- assertVisible:
    id: tab-exams
- assertVisible:
    id: tab-settings
- assertNotVisible:
    id: tab-groups
- assertNotVisible:
    text: "Gruplar"
- takeScreenshot: f-kucuk-yas-01-sekmeler
# ADR-001: no study card under 15 (the weekly button next to it is still there).
- scrollUntilVisible:
    element:
      id: open-weekly
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: open-share
- swipe:
    start: 50%, 30%
    end: 50%, 85%
# Still absent after a cold start.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 30000
- assertNotVisible:
    id: tab-groups
- assertNotVisible:
    text: "Gruplar"
- takeScreenshot: f-kucuk-yas-02-yeniden-acilis
