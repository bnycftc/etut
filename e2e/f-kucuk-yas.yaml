# f. 15 yaş altı (Gruplar sekmesi yok, K-16)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
# Step 1: the exam. Centred: Maestro counts a chip under the fixed bar as visible.
- scrollUntilVisible:
    element:
      id: exam-type-LGS
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: exam-type-LGS
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: onboarding-next
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-next
# Step 2: the countdown to the exam.
- extendedWaitUntil:
    visible:
      id: onboarding-countdown
    timeout: 15000
- tapOn:
    id: onboarding-next
# Step 3: the optional daily goal (skipped).
- extendedWaitUntil:
    visible:
      id: onboarding-goal-120
    timeout: 15000
- tapOn:
    id: onboarding-next
# Step 4: born 12 years ago: under 15 -> solo-only profile.
# Centred: Maestro counts a chip under the fixed bar as visible (it only checks the screen edges).
- scrollUntilVisible:
    element:
      id: "birth-year-${new Date().getFullYear() - 12}"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "birth-year-${new Date().getFullYear() - 12}"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: onboarding-start
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-start
    retryTapIfNoChange: true
- runFlow:
    file: subflows/ipucu-gec.yaml
- assertVisible:
    id: tab-timer
- assertVisible:
    id: tab-exams
- assertVisible:
    id: tab-settings
- assertNotVisible:
    id: tab-groups
- assertNotVisible:
    text: "Gruplar"
- takeScreenshot: f-kucuk-yas-01-sekmeler
# ADR-001: no study card under 15 (the weekly button next to it is still there).
- scrollUntilVisible:
    element:
      id: open-weekly
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: open-share
- swipe:
    start: 50%, 30%
    end: 50%, 85%
# Still absent after a cold start.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 30000
- assertNotVisible:
    id: tab-groups
- assertNotVisible:
    text: "Gruplar"
- takeScreenshot: f-kucuk-yas-02-yeniden-acilis
