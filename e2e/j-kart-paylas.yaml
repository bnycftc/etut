# j. Çalışma kartı (günlük/haftalık, açık/koyu; görüntü sistemin paylaşım sayfasıyla)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
# Paylaş is off at "0 dk" (nothing to share) and the card says why.
- scrollUntilVisible:
    element:
      id: open-share
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-share
- extendedWaitUntil:
    visible:
      id: share-card-preview
    timeout: 10000
# The note sits right above the button, below the card.
- scrollUntilVisible:
    element:
      id: share-card-share
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: share-nothing
- assertVisible:
    id: share-card-share
    enabled: false
- takeScreenshot: j-kart-00-bos
# Back to the timer by relaunching (as k-hakkinda-bos-durum leaves a pushed screen); then study
# past one minute.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 30000
- tapOn:
    id: subject-fizik
- tapOn:
    id: timer-start
- extendedWaitUntil:
    visible:
      id: timer-clock
      # Past one minute; a slow CI simulator may poll the clock late (still "1 dk" below 2:00).
      text: "1:[0-5][0-9]"
    timeout: 90000
- tapOn:
    id: timer-finish
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: timer-saved
    timeout: 10000
# The card button sits in the "Kendinle kıyas" card at the bottom of the timer screen.
- scrollUntilVisible:
    element:
      id: open-share
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-share
- extendedWaitUntil:
    visible:
      id: share-card-preview
    timeout: 10000
- assertNotVisible:
    id: share-nothing
- takeScreenshot: j-kart-01-gunluk-acik
- tapOn:
    id: share-period-week
- tapOn:
    id: share-theme-dark
- takeScreenshot: j-kart-02-haftalik-koyu
- scrollUntilVisible:
    element:
      id: share-card-share
    direction: DOWN
- tapOn:
    id: share-card-share
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: j-kart-03-paylasim-sayfasi
# Close the share sheet (tap above it, else drag it down); no error message may appear.
- tapOn:
    point: "50%,8%"
- runFlow:
    when:
      notVisible:
        id: share-card-share
    commands:
      - swipe:
          start: 50%, 55%
          end: 50%, 98%
          duration: 400
# The fallback drag above may also have scrolled the page up: scroll back down to the button.
- scrollUntilVisible:
    element:
      id: share-card-share
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: share-message
- takeScreenshot: j-kart-04-sonra
