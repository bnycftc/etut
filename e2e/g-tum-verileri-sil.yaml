# g. Tüm verileri sil (ilk açılışa dönüş)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
# Leave some data behind: one short study session.
- tapOn:
    id: timer-start
- extendedWaitUntil:
    visible:
      id: timer-clock
      text: "0:(0[2-9]|[1-5][0-9])"
    timeout: 15000
- tapOn:
    id: timer-finish
- assertVisible:
    id: timer-saved
- tapOn:
    id: tab-settings
# Settings grew (exam date, goal, pomodoro); the delete button is at the bottom.
# Centred: a row under the tab bar counts as visible to Maestro (it only checks the screen edges).
- scrollUntilVisible:
    element:
      id: settings-delete-all
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: g-sil-01-ayarlar
- tapOn:
    id: settings-delete-all
# The question is the system alert ("Evet, hepsini sil" is its destructive button): its buttons
# have no id, they are tapped by their text.
- extendedWaitUntil:
    visible: "Evet, hepsini sil"
    timeout: 10000
- takeScreenshot: g-sil-02-onay
# A backup is offered first: "Önce yedek al" opens the system share sheet and deletes nothing.
- tapOn: "Önce yedek al"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: g-sil-02b-yedek-paylasim
# Close the share sheet by dragging it down. No tap on the dimmed area as in i-yedek: if the sheet
# is already gone, that tap would land on the settings screen.
- swipe:
    start: 50%, 55%
    end: 50%, 98%
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "(?s).*kontrol edemez.*"
    commands:
      - swipe:
          start: 50%, 55%
          end: 50%, 98%
          duration: 400
# The question comes back and its last paragraph says the file was handed over (not the error text).
- extendedWaitUntil:
    visible: "(?s).*kontrol edemez.*"
    timeout: 20000
- takeScreenshot: g-sil-02c-yedek-notu
- tapOn: "Evet, hepsini sil"
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 10000
- takeScreenshot: g-sil-03-ilk-acilis
- scrollUntilVisible:
    element:
      id: onboarding-start
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: onboarding-start
    enabled: false
# The deletion is persistent: a cold start opens onboarding again.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 30000
- takeScreenshot: g-sil-04-yeniden-acilis
