# l. Hatırlatıcılar (açıklama ekranı; sistem izin penceresi açılmaz)
appId: com.bnycftc.etut
tags:
  - e2e
---
# notifications: unset = the student has not answered yet, so the explanation screen comes first.
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
- tapOn:
    id: tab-settings
# Centre the line right above the row (the timer card's last line), not the row itself: Maestro's
# centring swipe can park the row under the collapsed large title, where the tap lands on the
# navigation bar (run 39114266438: row at y=87, bar ends at y=116). About 120 pt below the centred
# line, the row stays clear of both the title and the tab bar.
- scrollUntilVisible:
    element:
      id: settings-away-info
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: settings-reminders
    direction: DOWN
- assertVisible:
    id: settings-reminders-summary
    text: "Bildirim izni verilmedi; hatırlatıcılar gelmez\\."
- takeScreenshot: l-hatirlaticilar-01-ayarlar
- tapOn:
    id: settings-reminders
- extendedWaitUntil:
    visible:
      id: reminder-daily-toggle
    timeout: 10000
# Before the student has confirmed reminders once, every reminder is off; no permission yet.
- assertVisible:
    id: reminders-permission-missing
# The toggles are switches named by their reminder (VoiceOver: "…, anahtar, kapalı").
- assertVisible:
    id: reminder-daily-toggle
    text: "Günlük çalışma hatırlatıcısı"
    checked: false
- assertVisible:
    id: reminder-long-toggle
    text: "Uzun oturum uyarısı"
    checked: false
- takeScreenshot: l-hatirlaticilar-02-liste
# Turning a reminder on opens the explanation, never the system prompt directly.
- tapOn:
    id: reminder-daily-toggle
- extendedWaitUntil:
    visible:
      id: notification-permission-allow
    timeout: 10000
- assertVisible:
    id: notification-permission-item-daily
# Only the reminder that was turned on comes on; the others stay off (each is turned on by itself).
- assertNotVisible:
    id: notification-permission-item-longSession
- assertVisible:
    id: notification-permission-others-off
# Apple HIG: one button ("Devam et") that leads to the system prompt, no second way out.
- assertNotVisible:
    id: notification-permission-later
- takeScreenshot: l-hatirlaticilar-03-aciklama
# The system prompt is not opened here: restart the app instead (the permission stays unanswered).
# Nothing was granted, so the reminder stays off and the app keeps working.
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: tab-settings
    timeout: 30000
- tapOn:
    id: tab-settings
# As above: centre the line above the row so the row is not under the large title.
- scrollUntilVisible:
    element:
      id: settings-away-info
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: settings-reminders
    direction: DOWN
- tapOn:
    id: settings-reminders
- extendedWaitUntil:
    visible:
      id: reminder-daily-toggle
    timeout: 10000
# The toggles are switches named by their reminder (VoiceOver: "…, anahtar, kapalı").
- assertVisible:
    id: reminder-daily-toggle
    text: "Günlük çalışma hatırlatıcısı"
    checked: false
- assertVisible:
    id: reminder-long-toggle
    text: "Uzun oturum uyarısı"
    checked: false
- assertVisible:
    id: reminders-permission-missing
- takeScreenshot: l-hatirlaticilar-04-izinsiz
