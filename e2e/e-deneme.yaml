# e. TYT denemesi (net = doğru − yanlış/4)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/onboarding-yks.yaml
    env:
      AGE: "20"
- tapOn:
    id: tab-exams
- tapOn:
    id: exams-add
- extendedWaitUntil:
    visible:
      id: exam-kind-TYT
    timeout: 10000
- tapOn:
    id: exam-kind-TYT
# Türkçe: 10 doğru, 4 yanlış -> 10 - 4/4 = 9 net.
# The number pad has no return key: the form draws its own "‹ Önceki / Sonraki › / Bitti" bar on
# top of it, and the pad is closed after each field with "Bitti" (exam-keyboard-done), as a student
# would. Closing it before the next tap keeps every tap aimed at a settled layout.
- tapOn:
    id: exam-correct-turkce
# The number pad is up (and the field focused) once the form's own keyboard bar shows;
# typing earlier can be lost (run 37953033218: "10" never reached exam-correct-turkce).
- extendedWaitUntil:
    visible:
      id: exam-keyboard-bar
    timeout: 10000
- inputText: "10"
- tapOn:
    id: exam-keyboard-done
- tapOn:
    id: exam-wrong-turkce
- extendedWaitUntil:
    visible:
      id: exam-keyboard-bar
    timeout: 10000
- inputText: "4"
- tapOn:
    id: exam-keyboard-done
- assertVisible:
    id: exam-net-turkce
    text: "9"
# Tarih: 3 doğru, 2 yanlış -> 3 - 2/4 = 2,5 net.
# The pad is already closed here; it is closed again after each value so taps hit a settled layout.
- scrollUntilVisible:
    element:
      id: exam-correct-tarih
    direction: DOWN
    centerElement: true
- tapOn:
    id: exam-correct-tarih
- extendedWaitUntil:
    visible:
      id: exam-keyboard-bar
    timeout: 10000
- inputText: "3"
- tapOn:
    id: exam-keyboard-done
- tapOn:
    id: exam-wrong-tarih
- extendedWaitUntil:
    visible:
      id: exam-keyboard-bar
    timeout: 10000
- inputText: "2"
- tapOn:
    id: exam-keyboard-done
- assertVisible:
    id: exam-net-tarih
    text: "2,5"
- scrollUntilVisible:
    element:
      id: exam-total-net
    direction: DOWN
- assertVisible:
    id: exam-total-net
    text: "11,5"
- takeScreenshot: e-deneme-01-form
- scrollUntilVisible:
    element:
      id: exam-save
    direction: DOWN
- tapOn:
    id: exam-save
# Back on the list: the new exam is the first row (TYT, 11,5 net).
# The list now starts with the analysis card and net charts, so the row can sit below the fold.
- scrollUntilVisible:
    element:
      id: exam-item-0
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: exam-item-0
    text: ".*TYT.*"
- assertVisible:
    id: exam-item-0
    text: ".*11,5 net.*"
- takeScreenshot: e-deneme-02-liste
# Edit the saved exam: Türkçe 4 yanlış -> 0 yanlış, so 10 + 2,5 = 12,5 net (same exam, no new row).
- tapOn:
    id: exam-item-0
- scrollUntilVisible:
    element:
      id: exam-edit
    direction: DOWN
- tapOn:
    id: exam-edit
- extendedWaitUntil:
    visible:
      id: exam-wrong-turkce
    timeout: 10000
- tapOn:
    id: exam-wrong-turkce
- extendedWaitUntil:
    visible:
      id: exam-keyboard-bar
    timeout: 10000
# The field holds one or two digits; erase generously.
- eraseText: 6
- inputText: "0"
- tapOn:
    id: exam-keyboard-done
- assertVisible:
    id: exam-total-net
    text: "12,5"
- tapOn:
    id: exam-save
- extendedWaitUntil:
    visible:
      id: exam-detail-total
      text: "12,5"
    timeout: 10000
- takeScreenshot: e-deneme-03-duzenlendi
