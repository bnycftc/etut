# App Store ekran görüntüleri (iPhone 6.9"): onboarding, demo yedeğini uygulamanın kendi "Yedekten
# geri yükle" akışıyla yükleme, sonra mağaza görüntüleri. Yalnız .github/workflows/store-screenshots.yml
# çalıştırır: o iş demo dosyasını (e2e/store/demo-backup.js) üretip simülatörün "iPhone'umda"
# klasörüne etut-demo.json olarak koyar, durum çubuğunu 9:41'e sabitler, açık modu seçer.
# Mağaza görüntüleri "NN-ad" adını taşır (iş yalnız bunları toplar); "debug-" olanlar teşhis içindir.
appId: com.bnycftc.etut
tags:
  - store
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/onboarding-yks.yaml
    env:
      AGE: "18"

# --- Demo verisini yükle (Ayarlar → Yedekle ve geri yükle → Yedekten geri yükle) ---
- tapOn:
    id: tab-settings
# Scroll past the button (to "Tüm verileri sil" below it): when the scroll stops as soon as the
# button shows, it can sit under the tab bar and the tap lands there (run 38238796629).
- scrollUntilVisible:
    element:
      id: settings-delete-all
    direction: DOWN
    timeout: 20000
- tapOn:
    id: settings-open-backup
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: backup-import
    timeout: 15000
- tapOn:
    id: backup-import
# The system document picker (Files UI, out of process). Where it opens differs between iOS
# versions (iOS 26: the empty "Son Kullanılanlar", tab "Göz At"; or the last folder): reach
# "iPhone'umda" step by step, each step only when the file is not shown yet.
- extendedWaitUntil:
    visible:
      text: "etut-demo.*|Göz At|Gözat|Browse|Son Kullanılanlar|Recents|iPhone.umda|On My iPhone"
    timeout: 30000
- takeScreenshot: debug-picker-1
- runFlow:
    when:
      notVisible:
        text: "etut-demo.*"
    commands:
      - tapOn:
          text: "Göz At|Gözat|Browse"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: debug-picker-2
- runFlow:
    when:
      notVisible:
        text: "etut-demo.*"
    commands:
      - tapOn:
          text: "iPhone.umda|On My iPhone"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: debug-picker-3
- extendedWaitUntil:
    visible:
      text: "etut-demo.*"
    timeout: 20000
- tapOn:
    text: "etut-demo.*"
- extendedWaitUntil:
    visible:
      id: backup-preview
    timeout: 30000
- takeScreenshot: debug-onizleme
# "Birleştir" is preselected: the onboarding profile (YKS Sayısal) stays, the file's goal, targets
# and data are added.
- scrollUntilVisible:
    element:
      id: backup-confirm
    direction: DOWN
    timeout: 20000
- tapOn:
    id: backup-confirm
- scrollUntilVisible:
    element:
      id: backup-message
    direction: UP
    timeout: 20000
- takeScreenshot: debug-yuklendi

# --- 01 Ana sayfa: geri sayım, bugün, seri, günlük hedef, dersler ---
# A fresh launch drops the settings stack and opens on the timer tab with the restored data.
- launchApp
- extendedWaitUntil:
    visible:
      id: streak
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: countdown
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-ana-sayfa

# --- 03 Deneme grafiği, 05 deneme listesi, 04 deneme analizi ---
- tapOn:
    id: tab-exams
- extendedWaitUntil:
    visible:
      id: exams-chart
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-deneme-grafigi
- scrollUntilVisible:
    element:
      id: exam-item-3
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-deneme-listesi
- scrollUntilVisible:
    element:
      id: exam-item-0
    direction: UP
    timeout: 20000
- tapOn:
    id: exam-item-0
- extendedWaitUntil:
    visible:
      id: exam-detail-total
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-deneme-analizi

# --- 06 Ders karnesi (Matematik, son ders) ---
- launchApp
- extendedWaitUntil:
    visible:
      id: today-total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: open-report
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-report
- extendedWaitUntil:
    visible:
      id: report-screen
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-ders-karnesi

# --- 07 Haftalık özet, 08 aylık takvim ---
- launchApp
- extendedWaitUntil:
    visible:
      id: today-total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: open-weekly
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-weekly
- extendedWaitUntil:
    visible:
      id: weekly-total
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-haftalik-ozet
- scrollUntilVisible:
    element:
      id: monthly-grid
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-aylik-takvim

# --- 02 Çalışan sayaç (pomodoro; Matematik son ders olarak seçili), 09 Canlı Etkinlik ---
- launchApp
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 30000
- scrollUntilVisible:
    element:
      id: mode-pomodoro
    direction: DOWN
    timeout: 20000
- tapOn:
    id: mode-pomodoro
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: timer-start
    direction: DOWN
    timeout: 20000
- tapOn:
    id: timer-start
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pomodoro-phase
    timeout: 15000
- scrollUntilVisible:
    element:
      id: today-total
    direction: UP
    timeout: 20000
# A few seconds into the block, so the countdown has moved.
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 4000
    optional: true
- takeScreenshot: 02-sayac
# Live Activity: Home, then Notification Center (Lock Screen presentation). The first activity
# asks for permission there (see e2e/m-canli-sayac.yaml).
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- tapOn:
    text: "İzin Ver|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Matematik"
    timeout: 10000
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- takeScreenshot: 09-canli-etkinlik
