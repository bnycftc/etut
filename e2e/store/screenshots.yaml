# App Store ekran görüntüleri (iPhone 6.9"): onboarding, demo yedeğini uygulamanın kendi "Yedekten
# geri yükle" akışıyla yükleme, sonra mağaza görüntüleri. Yalnız .github/workflows/store-screenshots.yml
# çalıştırır: o iş demo dosyasını (e2e/store/demo-backup.js) üretip simülatörün "iPhone'umda"
# klasörüne etut-demo.json olarak koyar, durum çubuğunu 9:41'e sabitler, açık modu seçer.
# Mağaza görüntüleri "NN-ad" adını taşır; "part-" olanlar kahraman karesi için gerçek Dynamic Island
# ve Live Activity kırpmaları (Maestro cropOn), "tam-" olanlar aynı anların tam ekranı (cropOn
# SpringBoard öğesini bulamazsa scripts/store-compose.mjs bunlardan kırpar); "debug-" olanlar
# teşhis içindir. Koyu mod görüntüsü ayrı akışta: e2e/store/screenshots-dark.yaml.
# Çerçeveli set (başlık, arka plan): scripts/store-compose.mjs, store/app-store/tr/screenshots.json.
appId: com.bnycftc.etut
tags:
  - store
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/onboarding-yks.yaml
    env:
      AGE: "18"

# --- Demo verisini yükle (Ayarlar → Yedekle ve geri yükle → Yedekten geri yükle) ---
- tapOn:
    id: tab-settings
# Scroll past the button (to "Tüm verileri sil" below it): when the scroll stops as soon as the
# button shows, it can sit under the tab bar and the tap lands there (run 38238796629).
- scrollUntilVisible:
    element:
      id: settings-delete-all
    direction: DOWN
    timeout: 20000
- tapOn:
    id: settings-open-backup
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: backup-import
    timeout: 15000
- tapOn:
    id: backup-import
# The system document picker (Files UI, out of process). Where it opens differs between iOS
# versions (iOS 26: the empty "Son Kullanılanlar", tab "Göz At"; or the last folder): reach
# "iPhone'umda" step by step, each step only when the file is not shown yet.
- extendedWaitUntil:
    visible:
      text: "etut-demo.*|Göz At|Gözat|Browse|Son Kullanılanlar|Recents|iPhone.umda|On My iPhone"
    # The first picker of a fresh simulator can stay blank for more than 30 s (run 38299848466).
    timeout: 90000
- takeScreenshot: debug-picker-1
- runFlow:
    when:
      notVisible:
        text: "etut-demo.*"
    commands:
      - tapOn:
          text: "Göz At|Gözat|Browse"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: debug-picker-2
- runFlow:
    when:
      notVisible:
        text: "etut-demo.*"
    commands:
      - tapOn:
          text: "iPhone.umda|On My iPhone"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: debug-picker-3
- extendedWaitUntil:
    visible:
      text: "etut-demo.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
# The whole file cell (its accessibility id); a tap on the name label while the folder was still
# settling did nothing (run 38245503752). One more tap if the picker is still up.
- tapOn:
    id: "etut-demo.json.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: backup-preview
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        text: "etut-demo.*"
    commands:
      - takeScreenshot: debug-picker-4
      - tapOn:
          id: "etut-demo.json.*"
- extendedWaitUntil:
    visible:
      id: backup-preview
    timeout: 30000
- takeScreenshot: debug-onizleme
# "Birleştir" is preselected: the onboarding profile (YKS Sayısal) stays, the file's goal, targets
# and data are added.
- scrollUntilVisible:
    element:
      id: backup-confirm
    direction: DOWN
    timeout: 20000
- tapOn:
    id: backup-confirm
- scrollUntilVisible:
    element:
      id: backup-message
    direction: UP
    timeout: 20000
- takeScreenshot: debug-yuklendi

# --- 01 Ana sayfa: geri sayım, bugün, seri, günlük hedef, dersler ---
# A fresh launch drops the settings stack and opens on the timer tab with the restored data.
- launchApp
- extendedWaitUntil:
    visible:
      id: streak
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: countdown
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-ana-sayfa

# --- 03 Deneme grafiği, 04 deneme analizi (son TYT) ---
- tapOn:
    id: tab-exams
- extendedWaitUntil:
    visible:
      id: exams-chart
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-deneme-grafigi
- scrollUntilVisible:
    element:
      id: exam-item-0
    direction: DOWN
    timeout: 30000
- tapOn:
    id: exam-item-0
- extendedWaitUntil:
    visible:
      id: exam-detail-total
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-deneme-analizi

# --- 05 Ders karnesi (Matematik, son ders) ---
- launchApp
- extendedWaitUntil:
    visible:
      id: today-total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: open-report
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-report
- extendedWaitUntil:
    visible:
      id: report-screen
    timeout: 15000
# Down to the net charts and the most missed topics: the "this week" figures above depend on the
# weekday of the run (little on a Monday). Maestro scrolls in 40 % swipes (about 550 pt with the
# fling on CI) and "centerElement" stops as soon as the card's centre is above 70 % of the screen,
# so where the card lands is chance: run 38303014516 ended at the bottom with the card's top at
# y = 7, its title under the 116 pt header. Instead: to the end of the screen (last card, one more
# scroll), a position set only by the demo data of the two bottom cards (card top ≈ 7), then a
# 17 % swipe back (≈ 160 pt, up to ≈ 330 with a fling): the card's top lands between ≈ 165 and
# ≈ 340, its bottom above the home indicator.
- scrollUntilVisible:
    element:
      id: report-missed
    direction: DOWN
    timeout: 20000
- scroll
- takeScreenshot: debug-karne-sonu
- swipe:
    start: 50%, 35%
    end: 50%, 52%
    duration: 1000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-ders-karnesi

# --- 06 Haftalık özet (geçen hafta, her zaman tam), 07 aylık takvim ---
- launchApp
- extendedWaitUntil:
    visible:
      id: today-total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: open-weekly
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-weekly
- extendedWaitUntil:
    visible:
      id: weekly-total
    timeout: 15000
# This week holds only the days so far; last week is a full one whatever the weekday of the run.
- tapOn:
    id: weekly-prev
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-haftalik-ozet
- scrollUntilVisible:
    element:
      id: monthly-grid
    direction: DOWN
    timeout: 30000
# Early in a month this month has only a few days: show the previous one, full of data.
- runFlow:
    when:
      true: "${new Date().getDate() < 10}"
    commands:
      - tapOn:
          id: monthly-prev
      - scrollUntilVisible:
          element:
            id: monthly-grid
          direction: DOWN
          timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-aylik-takvim

# --- "Uygulamadan çıkınca: Çalışmaya devam say" (Ayarlar), for the Lock Screen shots below ---
# With the default rule "Sor" the Live Activity says "Uygulamadan çıktın · mola sayılır" by the
# time the Notification Center is pulled down (more than 10 s on the CI simulator, see
# e2e/m-canli-sayac.yaml); with this setting it keeps counting and says "Çalışıyorsun".
- launchApp
- extendedWaitUntil:
    visible:
      id: today-total
    timeout: 30000
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-away-info
    direction: DOWN
    timeout: 20000
- tapOn:
    id: settings-away-count
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: settings-away-info
      text: ".*çalışma sayılır.*"
    timeout: 5000

# --- 02 Çalışan sayaç (pomodoro; Matematik son ders olarak seçili) ---
- launchApp
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 30000
- scrollUntilVisible:
    element:
      id: mode-pomodoro
    direction: DOWN
    timeout: 20000
- tapOn:
    id: mode-pomodoro
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: timer-start
    direction: DOWN
    timeout: 20000
- tapOn:
    id: timer-start
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pomodoro-phase
    timeout: 15000
- scrollUntilVisible:
    element:
      id: today-total
    direction: UP
    timeout: 20000
# About 400 s into the 25 min block (Maestro has no sleep: wait for an id that never exists), so
# the clock shows about 18:xx, the session total about 6:40 and the Live Activity's progress bar
# has moved.
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 400000
    optional: true
- takeScreenshot: 02-sayac

# --- Hero parts: the real Dynamic Island and Lock Screen presentation, cropped ---
# Only real renders, never a drawn device or Lock Screen (App Review 2.3.3). cropOn keeps the
# system notifications ("Ready for Apple Intelligence") and the simulator's wrong Lock Screen date
# out of the image. cropOn on SpringBoard elements is untested: the crops are optional and the
# full shots (tam-) are kept for the luma fallback of scripts/store-compose.mjs.
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: tam-dynamic-island
- takeScreenshot:
    path: part-dynamic-island
    cropOn:
      id: "jindo-container-view.*"
    optional: true
# Notification Center (pulled down from the top-left edge) shows the Lock Screen presentation.
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
# A swipe is lost now and then on the CI simulator (run e2e-ios-37-1, retry): pull once more.
- runFlow:
    when:
      notVisible:
        text: "Matematik"
    commands:
      - swipe:
          start: 15%, 0%
          end: 15%, 70%
          duration: 600
      - extendedWaitUntil:
          visible:
            id: e2e-never-present
          timeout: 2000
          optional: true
- takeScreenshot: debug-bildirim-merkezi
# First Live Activity of this install: iOS asks under the banner. Text is matched in full, so
# "İzin Ver" does not hit "İzin Verme".
- tapOn:
    text: "İzin Ver|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- extendedWaitUntil:
    visible:
      text: "Çalışıyorsun"
    timeout: 10000
    optional: true
- takeScreenshot: tam-canli-etkinlik
- takeScreenshot:
    path: part-canli-etkinlik
    cropOn:
      id: activity-content-view
    optional: true
- swipe:
    start: 50%, 99%
    end: 50%, 20%
    duration: 400
