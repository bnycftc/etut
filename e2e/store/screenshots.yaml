# App Store ekran görüntüleri (iPhone 6.9" ve iPad 13"; aynı akış iki cihazda): onboarding'in son
# adımında "Örnek verilerle gez" ile demo moduna uygulamanın içinden girilir (yedek dosyası yok),
# sonra mağaza görüntüleri alınır. Yalnız .github/workflows/store-screenshots.yml çalıştırır: o iş
# durum çubuğunu 9:41'e sabitler, açık modu seçer, Pazar günü çalışmaz (örnek planda Pazar dinlenme
# günü: "Bugünün planı" boş olur ve 04'teki "Başlat" bloğu bulunmaz).
# Mağaza görüntüleri "NN-ad" adını taşır, dosya adı sırası mağaza sırasıdır:
#   01 Bugünün planı · 02 net grafiği · 03 ders karnesi (en çok yanlış yapılan konular)
#   04 çalışan sayaç (pomodoro, plandan başlatılmış) · 05 Net hesapla · 06 Konular · 07 Plan sekmesi
# "part-" olanlar kahraman karesi için gerçek Dynamic Island ve Live Activity kırpmaları (Maestro
# cropOn), "tam-" olanlar aynı anların tam ekranı (cropOn SpringBoard öğesini bulamazsa
# scripts/store-compose.mjs bunlardan kırpar); "debug-" olanlar teşhis içindir. iPad'de Dynamic
# Island yoktur, oradaki part-/tam- görüntüleri kullanılmaz. Akışın sonunda sayaç bitirilir ve
# örnek moddan çıkılır: ardından koşan koyu mod akışı (e2e/store/screenshots-dark.yaml) "Yedekle ve
# geri yükle" ekranını gerçek modda çeker ("Örnek modda yedek alınmaz" uyarısı olmadan).
# Çerçeveli set (başlık, arka plan): scripts/store-compose.mjs, store/app-store/tr/screenshots.json.
appId: com.bnycftc.etut
tags:
  - store
---
- launchApp:
    clearState: true

# --- Onboarding → "Örnek verilerle gez" (as e2e/q-ornek-veri.yaml) ---
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
# Centred: Maestro counts a chip under the fixed bar as visible.
- scrollUntilVisible:
    element:
      id: exam-type-YKS
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: exam-type-YKS
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: yks-area-sayisal
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: yks-area-sayisal
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: onboarding-next
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible:
      id: onboarding-countdown
    timeout: 15000
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible:
      id: onboarding-goal-120
    timeout: 15000
- tapOn:
    id: onboarding-next
- scrollUntilVisible:
    element:
      id: "birth-year-${new Date().getFullYear() - 18}"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "birth-year-${new Date().getFullYear() - 18}"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: onboarding-demo
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-demo
    retryTapIfNoChange: true
- runFlow:
    file: ../subflows/ipucu-gec.yaml

# --- 01 Bugünün planı (Sayaç) ---
- extendedWaitUntil:
    visible:
      id: plan-card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: plan-card
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bugunun-plani

# --- 06 Konular (topic list with the TYT / AYT progress) ---
- scrollUntilVisible:
    element:
      id: open-topics
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: open-topics
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: topics-screen
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-konular

# --- 02 Net grafiği ---
# A fresh launch drops the pushed screens and opens on the timer tab; demo mode stays on.
- launchApp
- extendedWaitUntil:
    visible:
      id: timer-screen
    timeout: 30000
- tapOn:
    id: tab-exams
- extendedWaitUntil:
    visible:
      id: exams-chart
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-net-grafigi

# --- 05 Net hesapla (TYT, the first paper, is preselected) ---
- scrollUntilVisible:
    element:
      id: exams-net-calc
    direction: UP
    timeout: 20000
- tapOn:
    id: exams-net-calc
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: net-calc
    timeout: 15000
- tapOn:
    id: net-calc-correct-turkce
- inputText: "31"
- tapOn:
    id: net-calc-wrong-turkce
- inputText: "6"
- scrollUntilVisible:
    element:
      id: net-calc-correct-matematik
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: net-calc-correct-matematik
- inputText: "27"
- tapOn:
    id: net-calc-wrong-matematik
- inputText: "7"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: net-calc-net-matematik
      text: "25.*"
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      id: net-calc-net-turkce
    direction: UP
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-net-hesapla
- scrollUntilVisible:
    element:
      id: net-calc-close
    direction: DOWN
    timeout: 20000
- tapOn:
    id: net-calc-close

# --- 03 Ders karnesi: net charts and the most missed topics (last subject) ---
- launchApp
- extendedWaitUntil:
    visible:
      id: today-total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: open-report
    direction: DOWN
    timeout: 20000
- tapOn:
    id: open-report
- extendedWaitUntil:
    visible:
      id: report-screen
    timeout: 15000
# Down to the net charts and the most missed topics: the "this week" figures above depend on the
# weekday of the run. To the end of the screen (last card, one more scroll), then a 17 % swipe back:
# the card's top lands well below the header and its bottom above the home indicator (see the
# history of this flow, runs 38303014516 and after).
- scrollUntilVisible:
    element:
      id: report-missed
    direction: DOWN
    timeout: 20000
- scroll
- takeScreenshot: debug-karne-sonu
- swipe:
    start: 50%, 35%
    end: 50%, 52%
    duration: 1000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-ders-karnesi

# --- 07 Plan sekmesi: the week day by day ---
- launchApp
- extendedWaitUntil:
    visible:
      id: timer-screen
    timeout: 30000
- tapOn:
    id: tab-plan
- extendedWaitUntil:
    visible:
      id: plan-week
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-plan

# The Lock Screen shots below need the away rule "Çalışmaya devam say" (the default since 0.4.1,
# src/domain/timer.ts DEFAULT_AWAY_RULE): the Live Activity keeps counting ("Çalışıyorsun") while
# the Notification Center is pulled down.

# --- 04 Running timer: pomodoro, started from the first block of today's plan ---
- launchApp
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 30000
- scrollUntilVisible:
    element:
      id: mode-pomodoro
    direction: DOWN
    timeout: 20000
- tapOn:
    id: mode-pomodoro
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: plan-block-start-0
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: plan-block-start-0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pomodoro-phase
    timeout: 15000
- scrollUntilVisible:
    element:
      id: today-total
    direction: UP
    timeout: 20000
# About 400 s into the 25 min block (Maestro has no sleep: wait for an id that never exists), so
# the clock shows about 18:xx and the Live Activity's progress bar has moved.
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 400000
    optional: true
- takeScreenshot: 04-sayac

# --- Hero parts: the real Dynamic Island and Lock Screen presentation, cropped (iPhone) ---
# Only real renders, never a drawn device or Lock Screen (App Review 2.3.3). The crops are optional
# and the full shots (tam-) are kept for the luma fallback of scripts/store-compose.mjs.
- pressKey: Home
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 3000
    optional: true
- takeScreenshot: tam-dynamic-island
- takeScreenshot:
    path: part-dynamic-island
    cropOn:
      id: "jindo-container-view.*"
    optional: true
# Notification Center (pulled down from the top-left edge) shows the Lock Screen presentation.
- swipe:
    start: 15%, 0%
    end: 15%, 70%
    duration: 600
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
# A swipe is lost now and then on the CI simulator: pull once more. The subject of the first plan
# block is not fixed, so look for the activity text or the first-activity permission prompt.
- runFlow:
    when:
      notVisible:
        text: "Çalışıyorsun|İzin Ver|Allow"
    commands:
      - swipe:
          start: 15%, 0%
          end: 15%, 70%
          duration: 600
      - extendedWaitUntil:
          visible:
            id: e2e-never-present
          timeout: 2000
          optional: true
- takeScreenshot: debug-bildirim-merkezi
# First Live Activity of this install: iOS asks under the banner. Text is matched in full, so
# "İzin Ver" does not hit "İzin Verme".
- tapOn:
    text: "İzin Ver|Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-never-present
    timeout: 2000
    optional: true
- extendedWaitUntil:
    visible:
      text: "Çalışıyorsun"
    timeout: 10000
    optional: true
- takeScreenshot: tam-canli-etkinlik
- takeScreenshot:
    path: part-canli-etkinlik
    cropOn:
      id: activity-content-view
    optional: true
- swipe:
    start: 50%, 99%
    end: 50%, 20%
    duration: 400

# --- Clean up: finish the session and leave the sample data (for the dark mode flow) ---
- launchApp
- scrollUntilVisible:
    element:
      id: timer-finish
    direction: DOWN
    timeout: 30000
- tapOn:
    id: timer-finish
    retryTapIfNoChange: true
# Asked only after a long absence or a very long session; answered so the session is saved.
- runFlow:
    when:
      visible:
        id: finish-check
    commands:
      - tapOn:
          id: finish-away-credit
          optional: true
      - tapOn:
          id: finish-long-all
          optional: true
- extendedWaitUntil:
    visible:
      id: timer-saved
    timeout: 15000
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-demo-exit
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: settings-demo-exit
- extendedWaitUntil:
    visible:
      id: settings-demo-enter
    timeout: 15000
