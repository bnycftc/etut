# Completes the first launch in its four steps: exam YKS + area Sayısal, past the countdown and the
# optional goal, birth year (current year - AGE), then Başla and the one-time tips. Called with
# runFlow + env AGE. Ends on the timer tab.
appId: com.bnycftc.etut
---
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
# Step 1: exam and area. The brand band at the top and the fixed button bar at the bottom leave
# less of the page on the first screen: scroll to each target (a no-op when it is already visible).
# Centred: Maestro counts a chip under the fixed bar as visible (it only checks the screen edges).
- scrollUntilVisible:
    element:
      id: exam-type-YKS
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: exam-type-YKS
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: yks-area-sayisal
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: yks-area-sayisal
    retryTapIfNoChange: true
# İleri turns on only once the app has handled the area tap; on a stalled CI simulator that can
# come late, and a tap on the still disabled button does nothing (run 39114266438, g retry).
- extendedWaitUntil:
    visible:
      id: onboarding-next
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-next
# Step 2: the countdown.
- extendedWaitUntil:
    visible:
      id: onboarding-countdown
    timeout: 15000
- tapOn:
    id: onboarding-next
# Step 3: the optional daily goal (skipped).
- extendedWaitUntil:
    visible:
      id: onboarding-goal-120
    timeout: 15000
- tapOn:
    id: onboarding-next
# Step 4: the birth year.
- scrollUntilVisible:
    element:
      id: "birth-year-${new Date().getFullYear() - Number(AGE)}"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "birth-year-${new Date().getFullYear() - Number(AGE)}"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: onboarding-start
      enabled: true
    timeout: 30000
# A slow CI simulator can drop this tap (the screen stays on onboarding): tap again if nothing changes.
- tapOn:
    id: onboarding-start
    retryTapIfNoChange: true
- runFlow:
    file: ipucu-gec.yaml
