# Completes the first-launch screen: birth year (current year - AGE), exam YKS, area Sayısal,
# then closes the one-time tips. Called with runFlow + env AGE. Ends on the timer tab.
appId: com.bnycftc.etut
---
- extendedWaitUntil:
    visible:
      id: onboarding-start
    timeout: 60000
- tapOn:
    id: "birth-year-${new Date().getFullYear() - Number(AGE)}"
- tapOn:
    id: exam-type-YKS
# Scroll the outer screen (starting below the year list, which scrolls on its own) so the area
# chips and the start button are on screen.
- swipe:
    start: 50%, 85%
    end: 50%, 40%
- tapOn:
    id: yks-area-sayisal
# A slow CI simulator can drop this tap (the screen stays on onboarding): tap again if nothing changes.
- tapOn:
    id: onboarding-start
    retryTapIfNoChange: true
- runFlow:
    file: ipucu-gec.yaml
