# Completes the first-launch screen: birth year (current year - AGE), exam YKS, area Sayısal,
# then closes the one-time tips. Called with runFlow + env AGE. Ends on the timer tab.
appId: com.bnycftc.etut
---
- extendedWaitUntil:
    visible:
      id: onboarding-start
    timeout: 60000
- tapOn:
    id: "birth-year-${new Date().getFullYear() - Number(AGE)}"
- tapOn:
    id: exam-type-YKS
# The screen is taller than the viewport (year list, exam, area, optional goal, start): scroll to
# each target instead of a fixed swipe, which stops reaching the start button as cards are added.
- scrollUntilVisible:
    element:
      id: yks-area-sayisal
    direction: DOWN
    timeout: 20000
- tapOn:
    id: yks-area-sayisal
- scrollUntilVisible:
    element:
      id: onboarding-start
    direction: DOWN
    centerElement: true
    timeout: 20000
# A slow CI simulator can drop this tap (the screen stays on onboarding): tap again if nothing changes.
- tapOn:
    id: onboarding-start
    retryTapIfNoChange: true
- runFlow:
    file: ipucu-gec.yaml
