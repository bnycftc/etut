# a. İlk açılış (15+, YKS Sayısal)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 60000
- takeScreenshot: a-ilk-acilis-01-bos
# K-15: nothing is pre-selected, so İleri (fixed at the bottom) is disabled on the first step.
- assertVisible:
    id: onboarding-next
    enabled: false
# Step 1: exam and area. Centred: Maestro counts a chip under the fixed bar as visible.
- scrollUntilVisible:
    element:
      id: exam-type-YKS
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: exam-type-YKS
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: yks-area-sayisal
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: yks-area-sayisal
    retryTapIfNoChange: true
- takeScreenshot: a-ilk-acilis-02-secimler
- extendedWaitUntil:
    visible:
      id: onboarding-next
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-next
# Step 2: the countdown to the exam.
- extendedWaitUntil:
    visible:
      id: onboarding-countdown
    timeout: 15000
- tapOn:
    id: onboarding-next
# Step 3: the optional daily goal (skipped).
- extendedWaitUntil:
    visible:
      id: onboarding-goal-120
    timeout: 15000
- tapOn:
    id: onboarding-next
# Step 4: born 20 years ago, certainly 15 or older.
# Centred: Maestro counts a chip under the fixed bar as visible (it only checks the screen edges).
- scrollUntilVisible:
    element:
      id: "birth-year-${new Date().getFullYear() - 20}"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "birth-year-${new Date().getFullYear() - 20}"
    retryTapIfNoChange: true
# Başla and "Örnek verilerle gez" side by side in weight.
- assertVisible:
    id: onboarding-demo
- extendedWaitUntil:
    visible:
      id: onboarding-start
      enabled: true
    timeout: 30000
- tapOn:
    id: onboarding-start
    retryTapIfNoChange: true
# One-time tips: three steps, then the timer. The tips open in a modal; wait for its button (the
# modal container itself was once missing from Maestro's hierarchy for 30 s while on screen, run
# 38020253679), with the same 30 s as subflows/ipucu-gec.yaml.
- extendedWaitUntil:
    visible:
      id: tips-next
    timeout: 30000
- takeScreenshot: a-ilk-acilis-03a-ipucu
- tapOn:
    id: tips-next
- tapOn:
    id: tips-next
- tapOn:
    id: tips-done
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 15000
- assertNotVisible:
    id: tips-card
- assertVisible:
    id: today-total
# The group module is off (no server yet): no Groups tab, even for a 15+ profile (0.5.0).
- assertNotVisible:
    id: tab-groups
- takeScreenshot: a-ilk-acilis-03-sayac
