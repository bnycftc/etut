# a. İlk açılış (15+, YKS Sayısal)
appId: com.bnycftc.etut
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-start
    timeout: 60000
# K-15: nothing is pre-selected, so the start button is disabled.
- assertVisible:
    id: onboarding-start
    enabled: false
- takeScreenshot: a-ilk-acilis-01-bos
# Born 20 years ago: certainly 15 or older.
- tapOn:
    id: "birth-year-${new Date().getFullYear() - 20}"
- tapOn:
    id: exam-type-YKS
# Scroll the outer screen (starting below the year list, which scrolls on its own).
- swipe:
    start: 50%, 85%
    end: 50%, 40%
- tapOn:
    id: yks-area-sayisal
- takeScreenshot: a-ilk-acilis-02-secimler
- tapOn:
    id: onboarding-start
# One-time tips: three steps, then the timer.
- extendedWaitUntil:
    visible:
      id: tips-card
    timeout: 15000
- takeScreenshot: a-ilk-acilis-03a-ipucu
- tapOn:
    id: tips-next
- tapOn:
    id: tips-next
- tapOn:
    id: tips-done
- extendedWaitUntil:
    visible:
      id: timer-start
    timeout: 15000
- assertNotVisible:
    id: tips-card
- assertVisible:
    id: today-total
- assertVisible:
    id: tab-groups
- takeScreenshot: a-ilk-acilis-03-sayac
