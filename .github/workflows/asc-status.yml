# Read-only App Store Connect status of one Etüt version: version state, attached build, review
# submissions and their items, and whether the App Review contact fields are filled. Prints only
# states, dates, ids and yes/no; never contact values. Same API key secrets as asc-key-check.yml.
name: ASC status

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string
        required: true
        default: "0.4.0"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import base64, os, time, jwt, requests
          raw = os.environ["ASC_PRIVATE_KEY"]
          key = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          api = "https://api.appstoreconnect.apple.com/v1"
          auth = {"Authorization": "Bearer " + token}
          APP = "6818980777"
          VERSION = os.environ["VERSION"]

          def get(path, params=None):
              r = requests.get(api + path, headers=auth, params=params, timeout=30)
              if r.status_code >= 400:
                  print(f"GET {path}: HTTP {r.status_code}")
                  return None
              return r.json()

          vs = get(f"/apps/{APP}/appStoreVersions", {"filter[versionString]": VERSION, "filter[platform]": "IOS"})
          if not vs or not vs["data"]:
              raise SystemExit(f"version {VERSION} not found")
          ver = vs["data"][0]
          a = ver["attributes"]
          print(f"version {VERSION}: id {ver['id']}, appStoreState {a.get('appStoreState')}, "
                f"appVersionState {a.get('appVersionState')}, releaseType {a.get('releaseType')}, created {a.get('createdDate')}")

          b = get(f"/appStoreVersions/{ver['id']}/build")
          if b and b.get("data"):
              ba = b["data"]["attributes"]
              print(f"build: {ba.get('version')} processing {ba.get('processingState')} uploaded {ba.get('uploadedDate')} expired {ba.get('expired')}")
          else:
              print("build: none attached")

          d = get(f"/appStoreVersions/{ver['id']}/appStoreReviewDetail")
          if d and d.get("data"):
              da = d["data"]["attributes"]
              for f in ("contactFirstName", "contactLastName", "contactEmail", "contactPhone", "notes"):
                  print(f"review detail {f}: {'yes' if da.get(f) else 'NO'}")
              print(f"review detail demoAccountRequired: {da.get('demoAccountRequired')}")
          else:
              print("review detail: MISSING")

          subs = get(f"/apps/{APP}/reviewSubmissions", {"limit": 10, "include": "items"})
          for s in (subs or {}).get("data", []):
              sa = s["attributes"]
              print(f"submission {s['id']}: state {sa.get('state')} platform {sa.get('platform')} submitted {sa.get('submittedDate')}")
              items = get(f"/reviewSubmissions/{s['id']}/items", {"include": "appStoreVersion"})
              for it in (items or {}).get("data", []):
                  rel = [k for k, v in it.get("relationships", {}).items() if (v.get("data") if isinstance(v, dict) else None)]
                  print(f"  item {it['id']}: state {it['attributes'].get('state')} {rel}")

          info = get(f"/apps/{APP}/appInfos")
          for i in (info or {}).get("data", []):
              ia = i["attributes"]
              print(f"appInfo {i['id']}: state {ia.get('appStoreState') or ia.get('state')} ageRating {ia.get('appStoreAgeRating')}")
          PY
