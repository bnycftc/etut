name: Store screenshots (iPhone 6.9" + iPad 13")

# App Store screenshots, one matrix leg per display: the 6.9" iPhone (1320 × 2868 portrait) and the
# 13" iPad, "iPad Pro 13-inch (M4)" (2064 × 2752 portrait), PNG without alpha. Both legs run the
# same Maestro flow e2e/store/screenshots.yaml on a simulator: it enters the app's own example data
# from the last onboarding step ("Örnek verilerle gez", demo mode; built relative to the run by
# src/domain/demo-data.ts), takes the store screens and at the end leaves demo mode again.
# Nothing is uploaded to App Store Connect: the PNGs are artifacts. iPhone: app-store-screenshots-6.9
# (the raw screens, framed by store-frames.yml) and app-store-screenshots-6.9-parts (real Dynamic
# Island and Live Activity crops part-*, their full shots tam-*, the dark mode screen koyu-* from
# e2e/store/screenshots-dark.yaml). iPad: app-store-screenshots-ipad-13, the raw screens as they
# are (asc-screenshots.yml target ipad). Needs no secrets.
# The simulator build steps are copied from e2e-ios.yml (Release, embedded JS bundle, ad-hoc
# signed); the built .app (universal: supportsTablet) is cached by a hash of the app sources, so a
# run that only changes the flows or this file skips the build.

on:
  workflow_dispatch:
  push:
    branches:
      - store-screenshots

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  MIN_XCODE: "26.4"
  MAESTRO_VERSION: "2.11.0"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
  MAESTRO_CLI_NO_ANALYTICS: "true"
  MAESTRO_DISABLE_UPDATE_CHECK: "true"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  SIM_LANGUAGE: tr
  SIM_LOCALE: tr_TR
  SIM_TIMEZONE: Europe/Istanbul
  RESULTS: test-results/store
  APP_CACHE_DIR: build/app-cache

jobs:
  screenshots:
    name: Store screenshots (${{ matrix.label }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # App Store Connect 6.9" iPhone display (APP_IPHONE_67), portrait.
          - device: iphone
            label: iPhone 6.9"
            sim_names: '["iPhone 17 Pro Max", "iPhone 16 Pro Max"]'
            width: "1320"
            height: "2868"
            shots: app-store-screenshots-6.9
            parts: app-store-screenshots-6.9-parts
          # App Store Connect 13" iPad display (APP_IPAD_PRO_3GEN_129), portrait.
          - device: ipad
            label: iPad 13"
            sim_names: '["iPad Pro 13-inch (M4)", "iPad Pro 13-inch (M5)"]'
            width: "2064"
            height: "2752"
            shots: app-store-screenshots-ipad-13
            parts: ""
    env:
      DEVICE: ${{ matrix.device }}
      SIM_NAMES: ${{ matrix.sim_names }}
      SHOT_WIDTH: ${{ matrix.width }}
      SHOT_HEIGHT: ${{ matrix.height }}
      SHOTS: ${{ matrix.shots }}
      PARTS: ${{ matrix.parts }}
    steps:
      # The example data gives "today" about two hours of study that ended 15 min before the run
      # (src/domain/demo-data.ts). Shortly after midnight Istanbul time there is no room for it and
      # the first shots show "Bugün 0 dk" (run 38807345569, 00:24). Refuse to run before 04:00.
      # The example plan (daily goal 150 min) leaves Sunday free: "Bugünün planı" is then a rest
      # day without a block, and the flow starts the timer from the plan's first block.
      - name: Daytime and weekday guard (Europe/Istanbul)
        run: |
          hour="$(TZ=Europe/Istanbul date +%H)"
          hour=$((10#$hour))
          weekday="$(TZ=Europe/Istanbul date +%u)"
          if [ "$hour" -lt 4 ]; then
            echo "::error::It is $hour:xx in Istanbul. Run the store screenshots between 04:00 and 24:00 Istanbul time, otherwise today's demo study does not fit and the shots show 0 dk."
            exit 1
          fi
          if [ "$weekday" = "7" ]; then
            echo "::error::It is Sunday in Istanbul: the example plan has no blocks today. Run the store screenshots Monday to Saturday."
            exit 1
          fi
          echo "Istanbul hour $hour, weekday $weekday: ok"
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          current="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          lowest="$(printf '%s\n%s\n' "$MIN_XCODE" "$current" | sort -V | head -1)"
          if [ "$lowest" != "$MIN_XCODE" ]; then
            echo "::warning::Xcode $current is older than $MIN_XCODE required by Expo SDK 57. Available:"
            ls -d /Applications/Xcode*.app || true
          fi
          echo "XCODE_VERSION=$current" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Everything that goes into the .app (JS, native config, assets, dependencies, Xcode).
      - name: Restore cached simulator build
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.APP_CACHE_DIR }}
          key: store-app-${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json', 'app.json', 'index.ts', 'metro.config.js', 'tsconfig.json', 'app/**', 'src/**', 'plugins/**', 'assets/**') }}

      - name: Install JS dependencies
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install xcbeautify
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: brew list xcbeautify > /dev/null 2>&1 || brew install xcbeautify

      - name: Generate iOS project (expo prebuild)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Locate project
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          project="$(ls -d ios/*.xcodeproj | head -1)"
          [ -n "$project" ] || { echo "::error::expo prebuild produced no .xcodeproj"; exit 1; }
          scheme="$(basename "$project" .xcodeproj)"
          {
            echo "WORKSPACE=ios/$scheme.xcworkspace"
            echo "SCHEME=$scheme"
          } >> "$GITHUB_ENV"
          echo "Scheme: $scheme"

      - name: Install CocoaPods dependencies
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          pod install
          [ -d "../$WORKSPACE" ] || { echo "::error::pod install did not create $WORKSPACE"; exit 1; }

      # Same build as e2e-ios.yml: ad-hoc signed ("-") so the App Group entitlement stays and the
      # Live Activity is drawn.
      - name: Build app for the simulator (Release, ad-hoc signed)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-simulator.log | xcbeautify
          app="$(ls -d build/DerivedData/Build/Products/Release-iphonesimulator/*.app | head -1)"
          [ -n "$app" ] || { echo "::error::No .app was built"; exit 1; }
          for bin in "$app/$(basename "$app" .app)" "$app/PlugIns/ExpoWidgetsTarget.appex/ExpoWidgetsTarget"; do
            [ -f "$bin" ] || { echo "::error::Binary not found: $bin"; exit 1; }
            rm -f "$RUNNER_TEMP/ents.plist"
            segedit "$bin" -extract __TEXT __entitlements "$RUNNER_TEMP/ents.plist" 2>/dev/null
            grep -q 'group.com.bnycftc.etut' "$RUNNER_TEMP/ents.plist" 2>/dev/null \
              || { echo "::error::$bin has no App Group entitlement (Live Activity would render blank)"; exit 1; }
          done
          [ -f "$app/main.jsbundle" ] || { echo "::error::$app has no embedded main.jsbundle"; exit 1; }
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          [ "$bundle_id" = "com.bnycftc.etut" ] || { echo "::error::Unexpected bundle id $bundle_id"; exit 1; }
          rm -rf "$APP_CACHE_DIR"
          mkdir -p "$APP_CACHE_DIR"
          cp -R "$app" "$APP_CACHE_DIR/"

      - name: Save simulator build to the cache
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APP_CACHE_DIR }}
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      - name: Locate app
        run: |
          app="$(ls -d "$APP_CACHE_DIR"/*.app | head -1)"
          [ -n "$app" ] || { echo "::error::No .app in $APP_CACHE_DIR"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "APP_NAME=$(basename "$app" .app)" >> "$GITHUB_ENV"
          echo "App: $app (cache hit: ${{ steps.app-cache.outputs.cache-hit }})"

      - name: Set host time zone
        run: |
          sudo systemsetup -settimezone "$SIM_TIMEZONE" > /dev/null 2>&1 \
            || sudo ln -sf "/usr/share/zoneinfo/$SIM_TIMEZONE" /etc/localtime
          date

      # iPhone: 17 Pro Max / 16 Pro Max (1320 × 2868). iPad: iPad Pro 13-inch (M4), or the M5 of
      # the same size (2064 × 2752). Any other device would give screenshots App Store Connect does
      # not take for the slot, so fail instead of falling back.
      - name: Pick the ${{ matrix.label }} simulator (newest iOS runtime)
        run: |
          xcrun simctl list runtimes available
          python3 - <<'PY'
          import json, os, re, subprocess

          def simctl_json(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "--json"]))

          def version_key(version):
              return tuple(int(part) for part in re.findall(r"\d+", version))

          runtimes = [
              r for r in simctl_json("runtimes", "available")["runtimes"]
              if r.get("platform") == "iOS" or ".SimRuntime.iOS-" in r.get("identifier", "")
          ]
          if not runtimes:
              raise SystemExit("::error::No available iOS simulator runtime")
          wanted = json.loads(os.environ["SIM_NAMES"])
          family = "iPad" if os.environ["DEVICE"] == "ipad" else "iPhone"
          for runtime in sorted(runtimes, key=lambda r: version_key(r["version"]), reverse=True):
              types = {t["name"]: t for t in runtime.get("supportedDeviceTypes", [])}
              device = next((types[n] for n in wanted if n in types), None)
              if device is not None:
                  break
          else:
              names = sorted({t["name"] for r in runtimes for t in r.get("supportedDeviceTypes", []) if family in t["name"]})
              raise SystemExit(f"::error::No simulator of {', '.join(wanted)}. {family} types: {', '.join(names)}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIM_RUNTIME={runtime['identifier']}\n")
              env.write(f"SIM_DEVICE_TYPE={device['identifier']}\n")
          print(f"Runtime: {runtime['name']} ({runtime['identifier']})")
          print(f"Device:  {device['name']} ({device['identifier']})")
          PY

      - name: Boot simulator in Turkish, light mode
        run: |
          udid="$(xcrun simctl create "Etut Store" "$SIM_DEVICE_TYPE" "$SIM_RUNTIME")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLanguages -array "$SIM_LANGUAGE"
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLocale -string "$SIM_LOCALE"
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance light
          xcrun simctl ui "$udid" appearance
          xcrun simctl list devices booted
          # The device must render at the size of its App Store slot.
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/probe.png"
          w="$(sips -g pixelWidth "$RUNNER_TEMP/probe.png" | awk '/pixelWidth/ {print $2}')"
          h="$(sips -g pixelHeight "$RUNNER_TEMP/probe.png" | awk '/pixelHeight/ {print $2}')"
          echo "Simulator screen: ${w}x${h}"
          [ "$w" = "$SHOT_WIDTH" ] && [ "$h" = "$SHOT_HEIGHT" ] \
            || { echo "::error::Simulator screen is ${w}x${h}, expected ${SHOT_WIDTH}x${SHOT_HEIGHT}"; exit 1; }

      - name: Install app on the simulator
        run: |
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIM_UDID" com.bnycftc.etut app

      # As in e2e-ios.yml: the first launches after boot can take minutes on the runner.
      - name: Wait until the simulator launches apps
        run: |
          for bid in com.apple.Preferences com.bnycftc.etut; do
            start=$(date +%s)
            xcrun simctl launch "$SIM_UDID" "$bid" &
            pid=$!
            while kill -0 "$pid" 2>/dev/null && [ $(( $(date +%s) - start )) -lt 600 ]; do sleep 2; done
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"; echo "::error::$bid did not launch within 600 s"; exit 1
            fi
            wait "$pid" || { echo "::error::Launching $bid failed"; exit 1; }
            echo "$bid launched after $(( $(date +%s) - start )) s"
            sleep 3
            xcrun simctl terminate "$SIM_UDID" "$bid" || true
          done

      - name: Clean status bar
        run: |
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl status_bar "$SIM_UDID" list || true

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          installed="$("$HOME/.maestro/bin/maestro" --version 2>/dev/null | tail -1)"
          echo "Maestro $installed"
          case "$installed" in
            *"$MAESTRO_VERSION"*) ;;
            *) echo "::warning::Expected Maestro $MAESTRO_VERSION, --version printed: $installed" ;;
          esac

      # One flow; on the CI simulator the Maestro driver now and then loses taps or does not start,
      # so a failed attempt runs once more from scratch (the flow clears the app state itself).
      - name: Run the screenshot flow
        env:
          SIMCTL_CHILD_TZ: ${{ env.SIM_TIMEZONE }}
        run: |
          mkdir -p "$RESULTS"
          run_flow() {
            maestro --device "$SIM_UDID" test e2e/store/screenshots.yaml \
              --format junit \
              --output "$RESULTS/report-$1.xml" \
              --test-output-dir "$RESULTS/output-$1" \
              --debug-output "$RESULTS/debug-$1" 2>&1 | tee "$RESULTS/maestro-$1.log"
            return "${PIPESTATUS[0]}"
          }
          set +e
          run_flow 1
          status=$?
          attempt=1
          if [ "$status" -ne 0 ]; then
            echo "::warning::Screenshot flow failed on the first attempt; running it once more"
            pkill -f 'xcodebuild test-without-building' || true
            xcrun simctl status_bar "$SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            run_flow 2
            status=$?
            attempt=2
          fi
          echo "PASSED_ATTEMPT=$attempt" >> "$GITHUB_ENV"
          exit "$status"

      # The dark mode frame (iPhone only, the framed set): same simulator and app state (onboarding
      # from the flow above, which leaves demo mode at its end), the system switched to dark. Two
      # attempts like the flow above.
      - name: Run the dark mode flow
        if: matrix.device == 'iphone'
        env:
          SIMCTL_CHILD_TZ: ${{ env.SIM_TIMEZONE }}
        run: |
          xcrun simctl ui "$SIM_UDID" appearance dark
          xcrun simctl ui "$SIM_UDID" appearance
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          run_flow() {
            maestro --device "$SIM_UDID" test e2e/store/screenshots-dark.yaml \
              --format junit \
              --output "$RESULTS/report-dark-$1.xml" \
              --test-output-dir "$RESULTS/output-dark-$1" \
              --debug-output "$RESULTS/debug-dark-$1" 2>&1 | tee "$RESULTS/maestro-dark-$1.log"
            return "${PIPESTATUS[0]}"
          }
          set +e
          run_flow 1
          status=$?
          attempt=1
          if [ "$status" -ne 0 ]; then
            echo "::warning::Dark mode flow failed on the first attempt; running it once more"
            pkill -f 'xcodebuild test-without-building' || true
            run_flow 2
            status=$?
            attempt=2
          fi
          echo "DARK_PASSED_ATTEMPT=$attempt" >> "$GITHUB_ENV"
          exit "$status"

      # From the passing attempts: the store images ("NN-name.png") into $SHOTS, the sources of the
      # framed set into $PARTS: full screens (tam-*, koyu-*) and the cropped real renders (part-*,
      # any size). iPad: only the store images. Alpha is removed; full screens must have the size of
      # the slot (App Store Connect rejects anything else).
      - name: Check and flatten screenshots
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          mkdir -p "$SHOTS"
          [ -z "$PARTS" ] || mkdir -p "$PARTS"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import glob, os, re
          from PIL import Image
          results = os.environ["RESULTS"]
          light = os.path.join(results, f"output-{os.environ['PASSED_ATTEMPT']}")
          iphone = os.environ["DEVICE"] == "iphone"
          width, height = int(os.environ["SHOT_WIDTH"]), int(os.environ["SHOT_HEIGHT"])

          def find(src, pattern):
              return sorted(p for p in glob.glob(os.path.join(src, "**", "*.png"), recursive=True)
                            if re.fullmatch(pattern, os.path.basename(p)))

          store = find(light, r"\d\d-[a-z0-9-]+\.png")
          screens, crops = [], []
          if iphone:
              dark = os.path.join(results, f"output-dark-{os.environ['DARK_PASSED_ATTEMPT']}")
              screens = find(light, r"tam-[a-z0-9-]+\.png") + find(dark, r"koyu-[a-z0-9-]+\.png")
              crops = find(light, r"part-[a-z0-9-]+\.png")
          if not store:
              raise SystemExit(f"::error::No store screenshots under {light}")
          names = {os.path.basename(p) for p in screens}
          for required in (("tam-dynamic-island.png", "tam-canli-etkinlik.png", "koyu-yedek.png") if iphone else ()):
              if required not in names:
                  raise SystemExit(f"::error::{required} missing (store-frames.yml needs it)")
          bad, done = [], []
          # (files, destination, must be a full screen of the slot)
          for paths, out, full in ((store, os.environ["SHOTS"], True), (screens, os.environ["PARTS"], True),
                                   (crops, os.environ["PARTS"], False)):
              for p in paths:
                  name = os.path.basename(p)
                  img = Image.open(p)
                  print(f"{name}: {img.size[0]}x{img.size[1]} {img.mode}")
                  if full and img.size != (width, height):
                      bad.append(f"{name} is {img.size[0]}x{img.size[1]}")
                      continue
                  img.convert("RGB").save(os.path.join(out, name), "PNG", optimize=True)
                  done.append((out, name, img.size))
          for out, name, size in done:
              img = Image.open(os.path.join(out, name))
              assert img.mode == "RGB" and img.size == size, name
          if bad:
              raise SystemExit("::error::Wrong size: " + "; ".join(bad))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### {len(store)} screenshots, {width}×{height}, RGB PNG\n\n")
              for out, name, size in done:
                  s.write(f"- {out}/{name} ({size[0]}×{size[1]})\n")
              if iphone and not crops:
                  s.write("\nNo part-* crops (Maestro cropOn found nothing): store-frames.yml crops the tam-* shots.\n")
          PY

      - name: Upload store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHOTS }}
          path: ${{ env.SHOTS }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the sources of the framed set (store-frames.yml)
        if: matrix.device == 'iphone'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARTS }}
          path: ${{ env.PARTS }}
          if-no-files-found: error
          retention-days: 30

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RESULTS/logs"
          find "$RESULTS" -name '*.png' | sort || true
          cp -R "$HOME/.maestro/tests" "$RESULTS/logs/maestro-tests" 2>/dev/null || true
          cp build/xcodebuild-simulator.log "$RESULTS/logs/" 2>/dev/null || true
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
              --predicate 'process == "'"${APP_NAME:-Ett}"'"' > "$RESULTS/logs/app.log" 2>&1 || true
          fi

      - name: Upload run results (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-debug-${{ matrix.device }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS }}
          if-no-files-found: warn
          retention-days: 7

      - name: Shut down simulator
        if: always()
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl delete "$SIM_UDID" || true
          fi
