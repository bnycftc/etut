# Checks the App Store Connect API key (the same secrets testflight.yml uses) on a cheap Linux
# runner: signs a JWT and calls GET /v1/apps. Prints only HTTP status and Apple's error code.
name: ASC key check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call App Store Connect API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import base64, os, time, jwt, requests
          raw = os.environ["ASC_PRIVATE_KEY"]
          key = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          for path in ("/v1/apps?limit=1", "/v1/bundleIds?limit=200&fields[bundleIds]=identifier"):
              r = requests.get("https://api.appstoreconnect.apple.com" + path,
                               headers={"Authorization": "Bearer " + token}, timeout=30)
              print(path.split("?")[0], "HTTP", r.status_code)
              if r.ok and "bundleIds" in path:
                  print("bundle ids:", sorted(d["attributes"]["identifier"] for d in r.json()["data"]))
              elif not r.ok:
                  print("errors:", [(e.get("code"), e.get("title")) for e in r.json().get("errors", [])])
          # Capabilities of the app's own App ID (expo-widgets needs APP_GROUPS on it and on the extension).
          base = "https://api.appstoreconnect.apple.com/v1/bundleIds"
          auth = {"Authorization": "Bearer " + token}
          for ident in ("com.bnycftc.etut", "com.bnycftc.etut.ExpoWidgetsTarget"):
              r = requests.get(base, params={"filter[identifier]": ident}, headers=auth, timeout=30)
              for d in r.json().get("data", []):
                  if d["attributes"]["identifier"] != ident:
                      continue
                  c = requests.get(f"{base}/{d['id']}/bundleIdCapabilities", headers=auth, timeout=30)
                  print(ident, "capabilities HTTP", c.status_code,
                        sorted(x["attributes"]["capabilityType"] for x in c.json().get("data", [])))
          for path in ("/v1/certificates?limit=50", "/v1/profiles?limit=50", "/v1/devices?limit=5"):
              r = requests.get("https://api.appstoreconnect.apple.com" + path, headers=auth, timeout=30)
              data = r.json().get("data", [])
              kinds = [x["attributes"].get("certificateType") or x["attributes"].get("profileType")
                       or x["attributes"].get("platform") for x in data]
              print(path.split("?")[0], "HTTP", r.status_code, "count", len(data), sorted(kinds))
          # Latest uploads of Etüt (App Store Connect app 6818980777): build number, Apple's processing
          # state and the internal TestFlight state (e.g. IN_BETA_TESTING once testers can install it).
          r = requests.get("https://api.appstoreconnect.apple.com/v1/builds", headers=auth, timeout=30, params={
              "filter[app]": "6818980777", "sort": "-uploadedDate", "limit": "3",
              "include": "buildBetaDetail,preReleaseVersion"})
          inc = {(x["type"], x["id"]): x["attributes"] for x in r.json().get("included", [])}
          for b in r.json().get("data", []):
              rel = b.get("relationships", {})
              beta = inc.get(("buildBetaDetails", (rel.get("buildBetaDetail", {}).get("data") or {}).get("id")), {})
              pre = inc.get(("preReleaseVersions", (rel.get("preReleaseVersion", {}).get("data") or {}).get("id")), {})
              a = b["attributes"]
              print("build", pre.get("version"), a.get("version"), a.get("processingState"),
                    "internal:", beta.get("internalBuildState"), "uploaded:", a.get("uploadedDate"), "expired:", a.get("expired"))
          if not r.ok:
              print("builds errors:", [(e.get("code"), e.get("title")) for e in r.json().get("errors", [])])
          PY
