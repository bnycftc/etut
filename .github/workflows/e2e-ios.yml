name: E2E iOS (simulator)

# EXPLORE BRANCH ONLY (explore/0.4.x, 2026-10-18 keşif testi). Not for merging.
# Builds the app once per run (cached by the app's source tree, so a re-dispatch with only flow
# changes skips the build), then runs the exploratory Maestro flows in e2e/explore/ in parallel jobs
# (one per persona, plus a dark mode + accessibility-extra-large text pass). Every exploratory step
# is optional, so one failing check never stops a flow. Screenshots, Maestro debug output (per
# command status), the app's simulator log and crash reports are uploaded per job.

on:
  workflow_dispatch:
    inputs:
      personas:
        description: 'JSON list of jobs: p1-elif, p2-can, p3-mert, g-karanlik-buyuk'
        default: '["p1-elif","p2-can","p3-mert","g-karanlik-buyuk"]'

concurrency:
  group: e2e-ios-explore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  MIN_XCODE: "26.4"
  MAESTRO_VERSION: "2.11.0"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
  MAESTRO_CLI_NO_ANALYTICS: "true"
  MAESTRO_DISABLE_UPDATE_CHECK: "true"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  SIM_LANGUAGE: tr
  SIM_LOCALE: tr_TR
  SIM_TIMEZONE: Europe/Istanbul
  RESULTS: test-results/explore

jobs:
  build:
    name: Build app for the simulator
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      # Everything except the flows and workflows decides the app binary.
      - name: App cache key
        id: key
        run: |
          hash="$(git ls-files -s | awk -F'	' '$2 !~ /^(e2e|\.github)\//' | shasum -a 256 | cut -c1-24)"
          echo "key=explore-app-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore built app
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/app.tgz
          key: ${{ steps.key.outputs.key }}

      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          xcodebuild -version
          npm ci
          brew list xcbeautify > /dev/null 2>&1 || brew install xcbeautify
          npx expo prebuild --platform ios --clean --no-install
          project="$(ls -d ios/*.xcodeproj | head -1)"
          scheme="$(basename "$project" .xcodeproj)"
          (cd ios && pod install)
          mkdir -p build
          xcodebuild build \
            -workspace "ios/$scheme.xcworkspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-simulator.log | xcbeautify
          app="$(ls -d build/DerivedData/Build/Products/Release-iphonesimulator/*.app | head -1)"
          [ -f "$app/main.jsbundle" ] || { echo "::error::no embedded main.jsbundle"; exit 1; }
          mkdir -p build/app
          cp -R "$app" build/app/
          echo "$scheme" > build/app/SCHEME
          tar -czf build/app.tgz -C build/app .
          ls -la build/app.tgz

      - name: Save built app
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/app.tgz
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@v4
        with:
          name: explore-app
          path: build/app.tgz
          retention-days: 3

  explore:
    name: Explore ${{ matrix.flow }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(inputs.personas) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: explore-app
          path: build

      - name: Unpack app
        run: |
          mkdir -p build/app
          tar -xzf build/app.tgz -C build/app
          app="$(ls -d build/app/*.app | head -1)"
          echo "APP_PATH=$PWD/$app" >> "$GITHUB_ENV"
          echo "SCHEME=$(cat build/app/SCHEME)" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist"

      - name: Set host time zone
        run: |
          sudo systemsetup -settimezone "$SIM_TIMEZONE" > /dev/null 2>&1 \
            || sudo ln -sf "/usr/share/zoneinfo/$SIM_TIMEZONE" /etc/localtime
          date

      - name: Create iPhone simulator (newest iOS runtime)
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def simctl_json(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "--json"]))
          def version_key(version):
              return tuple(int(part) for part in re.findall(r"\d+", version))
          runtimes = [r for r in simctl_json("runtimes", "available")["runtimes"]
                      if r.get("platform") == "iOS" or ".SimRuntime.iOS-" in r.get("identifier", "")]
          runtime = max(runtimes, key=lambda r: version_key(r["version"]))
          device_types = [t for t in runtime.get("supportedDeviceTypes", []) if t.get("productFamily") == "iPhone"]
          def pick(pattern):
              matches = [t for t in device_types if re.fullmatch(pattern, t["name"])]
              return max(matches, key=lambda t: version_key(t["name"])) if matches else None
          device_type = pick(r"iPhone \d+") or pick(r"iPhone \d+ Pro") or device_types[-1]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIM_RUNTIME={runtime['identifier']}\n")
              env.write(f"SIM_DEVICE_TYPE={device_type['identifier']}\n")
          print(f"Runtime: {runtime['name']}  Device: {device_type['name']}")
          PY

      - name: Boot simulator in Turkish
        run: |
          udid="$(xcrun simctl create "Etut Explore" "$SIM_DEVICE_TYPE" "$SIM_RUNTIME")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLanguages -array "$SIM_LANGUAGE"
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLocale -string "$SIM_LOCALE"
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          if [ "${{ matrix.flow }}" = "g-karanlik-buyuk" ]; then
            xcrun simctl ui "$udid" appearance dark
            xcrun simctl ui "$udid" content_size accessibility-extra-large
            xcrun simctl ui "$udid" appearance || true
            xcrun simctl ui "$udid" content_size || true
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/start"

      - name: Install app and wait until the simulator launches apps
        run: |
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          for bid in com.apple.Preferences com.bnycftc.etut; do
            start=$(date +%s)
            xcrun simctl launch "$SIM_UDID" "$bid" &
            pid=$!
            while kill -0 "$pid" 2>/dev/null && [ $(( $(date +%s) - start )) -lt 600 ]; do sleep 2; done
            if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "::error::$bid did not launch"; exit 1; fi
            wait "$pid" || { echo "::error::Launching $bid failed"; exit 1; }
            echo "$bid launched after $(( $(date +%s) - start )) s"
            xcrun simctl terminate "$SIM_UDID" "$bid" || true
          done

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version 2>/dev/null | tail -1

      - name: Run exploratory flow
        env:
          SIMCTL_CHILD_TZ: ${{ env.SIM_TIMEZONE }}
        run: |
          mkdir -p "$RESULTS"
          run_maestro() {
            local tag="$1"
            maestro --device "$SIM_UDID" test "e2e/explore/${{ matrix.flow }}.yaml" \
              --format junit \
              --output "$RESULTS/report-$tag.xml" \
              --test-output-dir "$RESULTS/output-$tag" \
              --debug-output "$RESULTS/debug-$tag" 2>&1 | tee "$RESULTS/maestro-$tag.log"
            return "${PIPESTATUS[0]}"
          }
          set +e
          run_maestro 1
          status=$?
          if [ "$status" -ne 0 ] && grep -q 'IOSDriverTimeoutException' "$RESULTS/maestro-1.log" \
            && ! grep -qE '\[(Passed|Failed)\]' "$RESULTS/maestro-1.log"; then
            echo "::warning::Maestro driver did not start; running once more"
            pkill -f 'xcodebuild test-without-building' || true
            run_maestro 2
            status=$?
          fi
          echo "maestro exit status: $status"
          exit 0

      - name: Collect simulator logs and crash reports
        if: always()
        run: |
          mkdir -p "$RESULTS/logs/crash"
          find "$RESULTS" -name '*.png' | wc -l
          cp -R "$HOME/.maestro/tests" "$RESULTS/logs/maestro-tests" 2>/dev/null || true
          if [ -n "${SIM_UDID:-}" ]; then
            start="$(cat "$RUNNER_TEMP/start" 2>/dev/null || true)"
            xcrun simctl spawn "$SIM_UDID" log show --last 3h --style compact --info --debug \
              --predicate 'process == "'"$SCHEME"'" OR process CONTAINS "Etut" OR subsystem CONTAINS "com.facebook.react" OR process == "ExpoWidgetsTarget"' \
              > "$RESULTS/logs/app.log" 2>&1 || true
            xcrun simctl spawn "$SIM_UDID" log show --last 3h --style compact --info \
              --predicate '(process == "'"$SCHEME"'") AND (subsystem == "com.apple.network" OR subsystem == "com.apple.CFNetwork" OR eventMessage CONTAINS[c] "http")' \
              > "$RESULTS/logs/app-network.log" 2>&1 || true
            xcrun simctl spawn "$SIM_UDID" log show --last 3h --style compact \
              --predicate 'eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS "SIGABRT" OR eventMessage CONTAINS "jetsam"' \
              > "$RESULTS/logs/system-crash.log" 2>&1 || true
            wc -l "$RESULTS"/logs/*.log || true
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -newer "$RUNNER_TEMP/start" -type f -exec cp {} "$RESULTS/logs/crash/" \; 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -name "${SCHEME:-Ett}*" -exec cp {} "$RESULTS/logs/crash/" \; 2>/dev/null || true
          ls -la "$RESULTS/logs/crash" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-${{ matrix.flow }}
          path: ${{ env.RESULTS }}
          if-no-files-found: warn
          retention-days: 7

      - name: Shut down simulator
        if: always()
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl delete "$SIM_UDID" || true
          fi
