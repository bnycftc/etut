name: E2E iOS (simulator)

# End-to-end test of the real iOS app on an iPhone simulator, without a human tester.
# ios/ is generated with expo prebuild (never committed), built in Release for the simulator with
# the JS bundle embedded (no Metro, no signing), installed on a fresh simulator that boots in
# Turkish (tr_TR) with the Europe/Istanbul time zone, and driven by the Maestro flows in e2e/.
# Screenshots, the Maestro report and logs are uploaded as an artifact on every run.
# Needs no secrets. Adapted from testflight.yml (same runner, Xcode check and project discovery).
# Every night on main, and by hand (Actions → "E2E iOS (simulator)" → Run workflow). A run takes
# about an hour, so a push never starts it; the nightly run is the regular automatic check of the
# Live Activity and the widget on iOS.
#
# Network check of the under-15 flow (K-16: no server account, no request at all under 15).
# The simulator app is an ordinary macOS process on the runner, so its sockets are visible on the
# host. A probe (step "Start network probe") runs for the whole Maestro run and only records while
# e2e/f-kucuk-yas.yaml is between its onFlowStart and onFlowComplete hooks, which call the probe
# over HTTP (NET_PROBE_URL; without it, e.g. a local `maestro test e2e/`, the hooks do nothing).
# Every app process started inside that window (pgrep, every 0.2 s; the previous flow's process,
# alive when the window opens, is excluded) must have no internet socket at all:
# - lsof -i on those pids every 0.2 s (sees any open TCP/UDP socket, including listening ones);
# - nettop -P in log mode for the whole run (kernel network statistics per process, so it also
#   sees connections that open and close between two lsof samples).
# Before Maestro starts, each tool must see a known connection of its own (positive control): lsof
# a socket the probe holds, nettop a short curl. If lsof fails that, the job fails (no blind
# pass). nettop's log mode is not documented as stable; if it fails the control the check runs on
# lsof alone with a warning instead of failing a run over a tool problem.
# Not covered: name lookups go through the shared mDNSResponder daemon and are not attributable to
# the app; a connection the app would open has to follow one, and that is what is checked.

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC (06:00 Istanbul); scheduled runs use the default branch, main.
    - cron: "0 3 * * *"

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Expo SDK 57 needs Xcode 26.4 or newer.
  MIN_XCODE: "26.4"
  # Maestro CLI version for the official install script (tag cli-2.11.0, 2026-09-29); the flows
  # in e2e/ are written for it. Bump deliberately and re-run this workflow.
  MAESTRO_VERSION: "2.11.0"
  # Maestro's XCTest driver can be slow to start on a cold CI simulator (milliseconds).
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
  MAESTRO_CLI_NO_ANALYTICS: "true"
  MAESTRO_DISABLE_UPDATE_CHECK: "true"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  SIM_LANGUAGE: tr
  SIM_LOCALE: tr_TR
  SIM_TIMEZONE: Europe/Istanbul
  RESULTS: test-results/maestro
  # Network probe of the under-15 flow (see the top of this file and e2e/f-kucuk-yas.yaml).
  NET_PROBE_PORT: "8765"
  NET_PROBE_URL: http://127.0.0.1:8765

jobs:
  e2e:
    name: Build for simulator and run Maestro flows
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          current="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          lowest="$(printf '%s\n%s\n' "$MIN_XCODE" "$current" | sort -V | head -1)"
          if [ "$lowest" != "$MIN_XCODE" ]; then
            echo "::warning::Xcode $current is older than $MIN_XCODE required by Expo SDK 57. Available:"
            ls -d /Applications/Xcode*.app || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Maestro CLI runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Install xcbeautify
        run: brew list xcbeautify > /dev/null 2>&1 || brew install xcbeautify

      - name: Generate iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      # Expo derives the Xcode project name from app.json "name" with non-ASCII letters removed
      # ("Etüt" -> "Ett"), so the name is discovered instead of hard-coded.
      - name: Locate project
        run: |
          project="$(ls -d ios/*.xcodeproj | head -1)"
          [ -n "$project" ] || { echo "::error::expo prebuild produced no .xcodeproj"; exit 1; }
          scheme="$(basename "$project" .xcodeproj)"
          {
            echo "WORKSPACE=ios/$scheme.xcworkspace"
            echo "SCHEME=$scheme"
          } >> "$GITHUB_ENV"
          echo "Scheme: $scheme"
          # Same configuration checks as testflight.yml: widget extension generated, App Group on
          # both targets, no push entitlement.
          ext_dir="ios/ExpoWidgetsTarget"
          [ -f "$ext_dir/Info.plist" ] || { echo "::error::Widget extension Info.plist missing ($ext_dir)"; exit 1; }
          for ent in "ios/$scheme/$scheme.entitlements" "$ext_dir/ExpoWidgetsTarget.entitlements"; do
            [ -f "$ent" ] || { echo "::error::Entitlements file missing: $ent"; exit 1; }
            echo "$ent:"; plutil -p "$ent"
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$ent" | grep -qx '[[:space:]]*group.com.bnycftc.etut' \
              || { echo "::error::$ent lacks the App Group group.com.bnycftc.etut"; exit 1; }
            if /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ent" > /dev/null 2>&1; then
              echo "::error::$ent contains aps-environment; Etüt uses no push (see plugins/with-etut-ios.js)"; exit 1
            fi
          done
          # Privacy manifests (app.json ios.privacyManifests, plugins/with-etut-ios.js): both declare
          # the App Group UserDefaults reason 1C8F.1; the extension's is in its own Resources phase.
          for manifest in "ios/$scheme/PrivacyInfo.xcprivacy" "$ext_dir/PrivacyInfo.xcprivacy"; do
            [ -f "$manifest" ] || { echo "::error::Privacy manifest missing: $manifest"; exit 1; }
            plutil -p "$manifest" | grep -q '1C8F\.1' || { echo "::error::$manifest lacks the UserDefaults reason 1C8F.1"; exit 1; }
          done

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install
          [ -d "../$WORKSPACE" ] || { echo "::error::pod install did not create $WORKSPACE"; exit 1; }

      # Release: the JS bundle is compiled to Hermes bytecode and embedded in the .app, so no Metro
      # server is needed. Simulator builds need no certificate or profile, but they are ad-hoc
      # signed ("-"): an unsigned build drops the entitlements, and without the App Group the widget
      # extension cannot read the layouts expo-widgets stores there (blank Live Activity).
      - name: Build app for the simulator (Release, ad-hoc signed)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-simulator.log | xcbeautify
          app="$(ls -d build/DerivedData/Build/Products/Release-iphonesimulator/*.app | head -1)"
          [ -n "$app" ] || { echo "::error::No .app was built"; exit 1; }
          # Simulator entitlements live in the binary's __TEXT,__entitlements section, not the signature.
          for bin in "$app/$(basename "$app" .app)" "$app/PlugIns/ExpoWidgetsTarget.appex/ExpoWidgetsTarget"; do
            [ -f "$bin" ] || { echo "::error::Binary not found: $bin"; exit 1; }
            rm -f "$RUNNER_TEMP/ents.plist"
            segedit "$bin" -extract __TEXT __entitlements "$RUNNER_TEMP/ents.plist" 2>/dev/null
            grep -q 'group.com.bnycftc.etut' "$RUNNER_TEMP/ents.plist" 2>/dev/null \
              || { echo "::error::$bin has no App Group entitlement (Live Activity would render blank)"; exit 1; }
          done
          [ -f "$app/main.jsbundle" ] || { echo "::error::$app has no embedded main.jsbundle"; exit 1; }
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          [ "$bundle_id" = "com.bnycftc.etut" ] || { echo "::error::Unexpected bundle id $bundle_id"; exit 1; }
          ls -la "$app/main.jsbundle"
          # The widget / Live Activity extension is embedded and lives under the app's bundle id.
          appex="$app/PlugIns/ExpoWidgetsTarget.appex"
          [ -d "$appex" ] || { echo "::error::$appex was not embedded"; ls -la "$app/PlugIns" || true; exit 1; }
          ext_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")"
          echo "Extension: $ext_id"
          case "$ext_id" in
            com.bnycftc.etut.*) ;;
            *) echo "::error::Extension bundle id $ext_id is not under com.bnycftc.etut"; exit 1 ;;
          esac
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$app/Info.plist" | grep -qx true \
            || { echo "::error::NSSupportsLiveActivities is not set"; exit 1; }
          # Both bundles carry their own privacy manifest with the App Group reason (ITMS-91053).
          for manifest in "$app/PrivacyInfo.xcprivacy" "$appex/PrivacyInfo.xcprivacy"; do
            [ -f "$manifest" ] || { echo "::error::$manifest was not copied into the bundle"; exit 1; }
            echo "$manifest:"; plutil -p "$manifest"
            plutil -p "$manifest" | grep -q '1C8F\.1' || { echo "::error::$manifest lacks the UserDefaults reason 1C8F.1"; exit 1; }
          done
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      # The simulator takes its clock and time zone from the host.
      - name: Set host time zone
        run: |
          sudo systemsetup -settimezone "$SIM_TIMEZONE" > /dev/null 2>&1 \
            || sudo ln -sf "/usr/share/zoneinfo/$SIM_TIMEZONE" /etc/localtime
          date

      - name: Create iPhone simulator (newest iOS runtime)
        run: |
          xcrun simctl list runtimes available
          python3 - <<'PY'
          import json, os, re, subprocess

          def simctl_json(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "--json"]))

          def version_key(version):
              return tuple(int(part) for part in re.findall(r"\d+", version))

          runtimes = [
              r for r in simctl_json("runtimes", "available")["runtimes"]
              if r.get("platform") == "iOS" or ".SimRuntime.iOS-" in r.get("identifier", "")
          ]
          if not runtimes:
              raise SystemExit("::error::No available iOS simulator runtime")
          runtime = max(runtimes, key=lambda r: version_key(r["version"]))

          device_types = [t for t in runtime.get("supportedDeviceTypes", []) if t.get("productFamily") == "iPhone"]
          if not device_types:
              device_types = [t for t in simctl_json("devicetypes")["devicetypes"] if t.get("productFamily") == "iPhone"]
          if not device_types:
              raise SystemExit("::error::No iPhone device type for " + runtime["name"])

          # Prefer the newest regular-size "iPhone N", then "iPhone N Pro", else the last listed one.
          def pick(pattern):
              matches = [t for t in device_types if re.fullmatch(pattern, t["name"])]
              return max(matches, key=lambda t: version_key(t["name"])) if matches else None
          device_type = pick(r"iPhone \d+") or pick(r"iPhone \d+ Pro") or device_types[-1]

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIM_RUNTIME={runtime['identifier']}\n")
              env.write(f"SIM_DEVICE_TYPE={device_type['identifier']}\n")
          print(f"Runtime: {runtime['name']} ({runtime['identifier']})")
          print(f"Device:  {device_type['name']} ({device_type['identifier']})")
          PY

      - name: Boot simulator in Turkish
        run: |
          udid="$(xcrun simctl create "Etut E2E" "$SIM_DEVICE_TYPE" "$SIM_RUNTIME")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # Language and region are read at boot: write them, then reboot once.
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLanguages -array "$SIM_LANGUAGE"
          xcrun simctl spawn "$udid" defaults write "Apple Global Domain" AppleLocale -string "$SIM_LOCALE"
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults read "Apple Global Domain" AppleLanguages || true
          xcrun simctl spawn "$udid" defaults read "Apple Global Domain" AppleLocale || true
          xcrun simctl spawn "$udid" date || true
          xcrun simctl list devices booted

      - name: Install app on the simulator
        run: |
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIM_UDID" com.bnycftc.etut app

      # bootstatus does not wait for the second boot above ("Device already booted, nothing to do"),
      # and on the CI runner the first app launch after it can take ~5 minutes. Maestro's driver
      # timeout would run out during that launch (IOSDriverTimeoutException), so launch apps here
      # first and only start Maestro once the simulator launches them.
      - name: Wait until the simulator launches apps
        run: |
          for bid in com.apple.Preferences com.bnycftc.etut; do
            start=$(date +%s)
            xcrun simctl launch "$SIM_UDID" "$bid" &
            pid=$!
            while kill -0 "$pid" 2>/dev/null && [ $(( $(date +%s) - start )) -lt 600 ]; do sleep 2; done
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"; echo "::error::$bid did not launch within 600 s"; exit 1
            fi
            wait "$pid" || { echo "::error::Launching $bid failed"; exit 1; }
            echo "$bid launched after $(( $(date +%s) - start )) s"
            xcrun simctl terminate "$SIM_UDID" "$bid" || true
          done

      # The install script reads MAESTRO_VERSION (without the "cli-" prefix) from the environment.
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          installed="$("$HOME/.maestro/bin/maestro" --version 2>/dev/null | tail -1)"
          echo "Maestro $installed"
          case "$installed" in
            *"$MAESTRO_VERSION"*) ;;
            *) echo "::warning::Expected Maestro $MAESTRO_VERSION, --version printed: $installed" ;;
          esac

      - name: Start network probe
        id: probe
        run: |
          mkdir -p "$RESULTS/net-probe"
          cat > "$RUNNER_TEMP/net-probe.py" <<'PY'
          import http.server, json, os, pty, socket, subprocess, sys, threading, time

          APP = os.environ["SCHEME"]  # the app's executable name on the host
          OUT = os.path.join(os.environ["RESULTS"], "net-probe")
          lock = threading.Lock()
          windows = []        # [start, stop or None] of the under-15 flow
          excluded = set()    # app pids alive when a window opened (an earlier flow's process)
          seen = set()        # app pids started inside a window
          lsof_hits = []      # internet sockets of those pids (lsof lines)
          nettop_rows = {}    # pid -> first nettop row of any process with a socket
          nettop_lines = [0]
          control = {}

          def app_pids():
              out = subprocess.run(["pgrep", "-x", APP], capture_output=True, text=True).stdout
              return {int(p) for p in out.split()}

          def lsof(pids):
              out = subprocess.run(["lsof", "-nP", "-a", "-i", "-p", ",".join(map(str, sorted(pids)))],
                                   capture_output=True, text=True).stdout
              return [line for line in out.splitlines()[1:] if line.strip()]

          def nettop():
              # A pty keeps nettop's output line-buffered.
              master, slave = pty.openpty()
              subprocess.Popen(["sudo", "-n", "nettop", "-P", "-L", "0", "-s", "1", "-n"],
                               stdin=subprocess.DEVNULL, stdout=slave, stderr=slave, start_new_session=True)
              os.close(slave)
              buf = b""
              with open(os.path.join(OUT, "nettop.log"), "w") as log:
                  while True:
                      try:
                          chunk = os.read(master, 65536)
                      except OSError:
                          break
                      if not chunk:
                          break
                      buf += chunk
                      *lines, buf = buf.split(b"\n")
                      for raw in lines:
                          line = raw.decode("utf-8", "replace").strip("\r")
                          fields = line.split(",")
                          name, dot, pid = (fields[1] if len(fields) > 1 else "").rpartition(".")
                          with lock:
                              nettop_lines[0] += 1
                              if dot and pid.isdigit():
                                  nettop_rows.setdefault(int(pid), line)
                          if nettop_lines[0] <= 20 or name in (APP, "curl"):
                              log.write(line + "\n")
                              log.flush()

          def sampler():
              while True:
                  with lock:
                      active = bool(windows) and windows[-1][1] is None
                      skip = set(excluded)
                  if active:
                      pids = app_pids() - skip
                      hits = lsof(pids) if pids else []
                      with lock:
                          seen.update(pids)
                          lsof_hits.extend(h for h in hits if h not in lsof_hits)
                  time.sleep(0.2)

          def report():
              with lock:
                  return {
                      "control": control,
                      "windows": [[round(a, 3), b and round(b, 3)] for a, b in windows],
                      "excluded_pids": sorted(excluded),
                      "app_pids": sorted(seen),
                      "lsof": list(lsof_hits),
                      "nettop": [nettop_rows[p] for p in sorted(seen) if p in nettop_rows],
                      "nettop_lines": nettop_lines[0],
                  }

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  now = time.time()
                  if self.path == "/start":
                      alive = app_pids()
                      with lock:
                          if windows and windows[-1][1] is None:
                              windows[-1][1] = now
                          excluded.update(alive)
                          windows.append([now, None])
                      body = {"ok": True}
                  elif self.path == "/stop":
                      with lock:
                          if windows and windows[-1][1] is None:
                              windows[-1][1] = now
                      body = {"ok": True}
                  elif self.path == "/status":
                      body = report()
                  else:
                      self.send_error(404)
                      return
                  data = json.dumps(body).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def log_message(self, fmt, *args):
                  sys.stderr.write(time.strftime("%H:%M:%S ") + (fmt % args) + "\n")

          threading.Thread(target=nettop, daemon=True).start()
          deadline = time.time() + 30
          while time.time() < deadline and not nettop_rows:
              time.sleep(0.5)
          # Positive control: lsof sees a socket this process holds; nettop sees a short curl.
          with socket.create_connection(("github.com", 443), timeout=20):
              control["lsof"] = bool(lsof({os.getpid()}))
          curl = subprocess.Popen(["curl", "-sS", "-o", "/dev/null", "--max-time", "20", "https://github.com"])
          curl.wait()
          deadline = time.time() + 15
          while time.time() < deadline and curl.pid not in nettop_rows:
              time.sleep(0.25)
          control["nettop"] = curl.pid in nettop_rows
          print("control:", json.dumps(control), flush=True)
          threading.Thread(target=sampler, daemon=True).start()
          http.server.ThreadingHTTPServer(("127.0.0.1", int(os.environ["NET_PROBE_PORT"])), Handler).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/net-probe.py" > "$RESULTS/net-probe/probe.log" 2>&1 &
          echo "NET_PROBE_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            curl -fsS "$NET_PROBE_URL/status" -o "$RUNNER_TEMP/probe-status.json" 2>/dev/null && break
            sleep 1
          done
          cat "$RESULTS/net-probe/probe.log"
          [ -s "$RUNNER_TEMP/probe-status.json" ] || { echo "::error::The network probe did not start"; exit 1; }
          python3 - <<'PY'
          import json, os
          control = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "probe-status.json")))["control"]
          if not control.get("lsof"):
              raise SystemExit("::error::Network probe: lsof did not see the probe's own connection; the check would be blind")
          if not control.get("nettop"):
              print("::warning::Network probe: nettop did not see a short curl connection; the under-15 check relies on lsof polling only")
          PY

      - name: Run Maestro flows
        env:
          # Passed by simctl to the app Maestro launches (in addition to the host time zone above).
          SIMCTL_CHILD_TZ: ${{ env.SIM_TIMEZONE }}
        run: |
          mkdir -p "$RESULTS"
          run_maestro() {
            local tag="$1"; shift
            maestro --device "$SIM_UDID" test "${@:-e2e/}" \
              -e "NET_PROBE_URL=$NET_PROBE_URL" \
              --format junit \
              --output "$RESULTS/report-$tag.xml" \
              --test-output-dir "$RESULTS/output" \
              --debug-output "$RESULTS/debug" 2>&1 | tee "$RESULTS/maestro-$tag.log"
            return "${PIPESTATUS[0]}"
          }
          set +e
          run_maestro 1
          status=$?
          cp "$RESULTS/report-1.xml" "$RESULTS/report.xml" 2>/dev/null
          # Maestro's XCTest driver sometimes does not come up on a cold CI simulator
          # (IOSDriverTimeoutException before any flow ran). That is no test result: try once more.
          if [ "$status" -ne 0 ] && grep -q 'IOSDriverTimeoutException' "$RESULTS/maestro-1.log" \
            && ! grep -qE '\[(Passed|Failed)\]' "$RESULTS/maestro-1.log"; then
            echo "::warning::Maestro driver did not start; running the flows once more"
            # Maestro exits without stopping the xcodebuild that launches its runner; left alive, it
            # competes with the second attempt's runner for the same simulator.
            pkill -f 'xcodebuild test-without-building' || true
            run_maestro 2
            status=$?
            cp "$RESULTS/report-2.xml" "$RESULTS/report.xml" 2>/dev/null
          fi
          # Any failed flow runs once more in a new driver session, and its second result is kept.
          # On the CI simulator the Maestro driver loses taps and stalls for tens of seconds now and
          # then (a different flow each run), and it can exit mid-run (DeviceUnreachableException),
          # failing every later flow. A real bug fails both runs; the retried flows are listed in
          # the run summary so a flaky flow stays visible.
          if [ "$status" -ne 0 ] && [ -f "$RESULTS/report.xml" ]; then
            # macOS runners run bash 3.2: no mapfile. Flow files have no spaces, so a plain list works.
            lost="$(python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          for case in ET.parse(os.path.join(os.environ["RESULTS"], "report.xml")).getroot().iter("testcase"):
              bad = case.find("failure") if case.find("failure") is not None else case.find("error")
              if bad is not None:
                  print(f"e2e/{case.get('name')}.yaml")
          PY
            )"
            lost="$(echo $lost | tr -d '\015')"
            if [ -n "$lost" ]; then
              count="$(echo $lost | wc -w | tr -d ' ')"
              echo "::warning::$count flow(s) failed; running them once more in a new driver session: $lost"
              { echo "Retried once (failed on the first run): $lost"; } >> "$GITHUB_STEP_SUMMARY"
              # shellcheck disable=SC2086
              run_maestro retry $lost
              python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = os.path.join(os.environ["RESULTS"], "report.xml")
          tree = ET.parse(path)
          retry = {c.get("name"): c for c in ET.parse(os.path.join(os.environ["RESULTS"], "report-retry.xml")).getroot().iter("testcase")}
          for suite in tree.getroot().iter("testsuite"):
              for i, case in enumerate(list(suite)):
                  if case.tag == "testcase" and case.get("name") in retry:
                      suite.remove(case); suite.insert(i, retry[case.get("name")])
          tree.write(path, encoding="utf-8", xml_declaration=True)
          failed = sum(1 for c in tree.getroot().iter("testcase") if c.find("failure") is not None or c.find("error") is not None)
          print(f"After retry: {failed} failed flow(s)")
          raise SystemExit(1 if failed else 0)
          PY
              status=$?
            fi
          fi
          exit "$status"

      # Evaluated even when a flow failed: the under-15 app processes must have had no socket.
      - name: Under-15 flow made no network connection
        if: always() && steps.probe.outcome == 'success'
        run: |
          curl -fsS "$NET_PROBE_URL/status" -o "$RESULTS/net-probe/report.json" \
            || { echo "::error::The network probe is not answering"; exit 1; }
          kill "$NET_PROBE_PID" 2>/dev/null || true
          sudo -n pkill -x nettop 2>/dev/null || true
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RESULTS"], "net-probe", "report.json")))
          print(json.dumps({k: v for k, v in r.items() if k not in ("lsof", "nettop")}, indent=2))
          problems = []
          if not r["windows"]:
              problems.append("f-kucuk-yas.yaml never opened a probe window (onFlowStart hook did not run)")
          elif not r["app_pids"]:
              problems.append("no app process was seen during the under-15 flow")
          for line in r["lsof"]:
              problems.append("lsof: " + line)
          for line in r["nettop"]:
              problems.append("nettop: " + line)
          tools = "lsof + nettop" if r["control"].get("nettop") else "lsof only (nettop failed its control)"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if problems:
                  summary.write(f"Under-15 network check FAILED ({tools}):\n\n")
                  summary.writelines(f"- `{p}`\n" for p in problems)
              else:
                  summary.write(f"Under-15 network check: app processes {r['app_pids']} had no internet socket ({tools}).\n")
          for p in problems:
              print("::error::Under-15 network check: " + p)
          raise SystemExit(1 if problems else 0)
          PY

      - name: Summary
        if: always()
        run: |
          [ -f "$RESULTS/report.xml" ] || { echo "No Maestro report was written." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RESULTS"], "report.xml")).getroot()
          print("| Akış | Sonuç | Süre (sn) |")
          print("|---|---|---|")
          for case in root.iter("testcase"):
              failed = case.find("failure") is not None or case.find("error") is not None
              print(f"| {case.get('name')} | {'HATA' if failed else 'geçti'} | {case.get('time', '')} |")
          PY

      # Maestro 2.7+ writes takeScreenshot images to
      # <test-output-dir>/<timestamp>/<flow name>/takeScreenshot/<name>.png (inside $RESULTS/output).
      - name: Collect simulator logs
        if: always()
        run: |
          mkdir -p "$RESULTS/logs"
          echo "Screenshots:"; find "$RESULTS" -name '*.png' | sort || true
          cp -R "$HOME/.maestro/tests" "$RESULTS/logs/maestro-tests" 2>/dev/null || true
          cp build/xcodebuild-simulator.log "$RESULTS/logs/" 2>/dev/null || true
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
              --predicate 'process == "'"$SCHEME"'"' > "$RESULTS/logs/app.log" 2>&1 || true
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -name "${SCHEME:-Ett}*" -exec cp {} "$RESULTS/logs/" \; 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS }}
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down simulator
        if: always()
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl delete "$SIM_UDID" || true
          fi
