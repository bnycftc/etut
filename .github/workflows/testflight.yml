name: TestFlight

# Generates the native iOS project with Expo prebuild (ios/ is never committed), archives it with
# Xcode automatic signing and uploads it to App Store Connect / TestFlight. Adapted from the
# working CarPlay Medya workflow; no EAS and no Expo account involved.
# xcodebuild authenticates with an App Store Connect API key (-allowProvisioningUpdates +
# -authenticationKey*); Xcode creates the provisioning profiles itself, none are stored.
#
# Distribution signing:
# - If DIST_CERT_P12_BASE64 + DIST_CERT_PASSWORD are set, that Apple Distribution identity is put in a
#   temporary keychain and -exportArchive signs with it locally.
# - Otherwise -exportArchive falls back to the cloud-managed distribution certificate. For team
#   26322AY3MH that path was rejected on upload with ITMS-90035 "Invalid Signature" in CarPlay Medya,
#   so setting DIST_CERT_P12_BASE64 is strongly recommended.
# "Verify distribution signature" checks the exported IPA before anything is uploaded: the app and
# every embedded extension (the expo-widgets target com.bnycftc.etut.ExpoWidgetsTarget: Home Screen
# widget + Live Activity) must be distribution-signed, carry the same version/build number and the
# App Group group.com.bnycftc.etut, must not carry aps-environment (no push is used), and must
# contain its own PrivacyInfo.xcprivacy declaring the App Group UserDefaults reason 1C8F.1.
# Automatic signing registers the extension's App ID and the App Group capability itself; if
# Apple refuses, register them once by hand (README, "App Store Connect'te elle yapılacaklar").
#
# Gate (job "gate", ubuntu, before any macOS minute): a tag v<x.y.z> must equal app.json
# expo.version; without internal_only only main, a v* tag on main or a release/<version> branch
# whose <version> equals app.json expo.version may build; npm ci, tsc and jest must pass.
#
# Group module: GROUPS_PHASE in src/config/features.ts. With 'off' the build has no server address
# and needs nothing more. With 'beta18' or 'public' the gate requires the repository variables
# SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (passed to the bundle as EXPO_PUBLIC_SUPABASE_*), jest
# requires that phase's launch blockers to be done, and the signed app must carry the Declared Age
# Range entitlement (K-17).
#
# Required repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (raw .p8 text or base64 of it).
# The API key needs the Admin role: cloud-managed distribution signing is refused for other roles.
# Optional: DIST_CERT_P12_BASE64 (base64 of an Apple Distribution .p12), DIST_CERT_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      internal_only:
        description: "Internal TestFlight testing only: allow the [DOLDURULACAK] legal placeholders and a ref other than main or release/<version>. Such a build must never go to external testing or App Review."
        type: boolean
        default: false
  push:
    tags: ["v*"]

# Only one upload at a time; a queued run waits instead of cancelling one that is mid-upload.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  TEAM_ID: 26322AY3MH
  # Expo SDK 57 needs Xcode 26.4 or newer.
  MIN_XCODE: "26.4"
  # CFBundleVersion. run_attempt keeps "Re-run jobs" from reusing an already uploaded number
  # (12.1 -> 12.2 -> 13.1 all increase).
  BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  gate:
    name: Release ref, version, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      groups_phase: ${{ steps.phase.outputs.groups_phase }}
    steps:
      # Full history: the check below needs origin/main next to the tagged commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # App Store Connect can send any uploaded build to external testing or App Review, so only
      # the release line uploads: main, a v* tag on a commit of main whose version is the app's, or
      # the release/<version> branch of the version under review (<version> = app.json expo.version).
      - name: Release ref and version
        env:
          INTERNAL_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.internal_only }}
        run: |
          app_version="$(node -p "require('./app.json').expo.version")"
          echo "Ref $GITHUB_REF ($GITHUB_SHA), app.json version $app_version"
          case "$GITHUB_REF" in
            refs/tags/v*)
              [ "${GITHUB_REF_NAME#v}" = "$app_version" ] \
                || { echo "::error::Tag $GITHUB_REF_NAME does not match app.json expo.version $app_version"; exit 1; }
              ;;
          esac
          if [ "$INTERNAL_ONLY" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::warning::Built from $GITHUB_REF, not main. Internal TestFlight only."
              echo "Build $BUILD_NUMBER from $GITHUB_REF (not main): internal TestFlight only." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/heads/release/*)
              [ "${GITHUB_REF_NAME#release/}" = "$app_version" ] \
                || { echo "::error::Branch $GITHUB_REF_NAME does not match app.json expo.version $app_version (expected release/$app_version)"; exit 1; }
              ;;
            refs/tags/v*)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
                || { echo "::error::Tag $GITHUB_REF_NAME is not on main. Tag a commit of main, or run manually with internal_only."; exit 1; }
              ;;
            *)
              echo "::error::$GITHUB_REF is neither main, release/$app_version nor a v* tag. Run from one of them, or manually with internal_only for internal testing."
              exit 1
              ;;
          esac

      # GROUPS_PHASE (src/config/features.ts) decides whether the build talks to the server. 'off'
      # builds without the server address (no group module, no network). Any other phase needs the
      # repository variables (Settings -> Secrets and variables -> Actions -> Variables; public
      # values, not secrets) SUPABASE_URL (https://api.<domain>) and SUPABASE_PUBLISHABLE_KEY (the
      # publishable / anon key). A service or secret key must never reach the app bundle.
      # internal_only does not relax this. The launch blockers of the phase are checked by jest
      # below (src/config/__tests__/launch-gate.test.ts).
      - name: Group module phase
        id: phase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Same pattern as launch-gate.test.ts ("declares the phase in the form testflight.yml reads").
          phases="$(sed -nE "s/^export const GROUPS_PHASE(: *[A-Za-z]+)? *= *'([a-z0-9]+)' *;.*/\2/p" src/config/features.ts)"
          [ "$(printf '%s\n' "$phases" | grep -c .)" = 1 ] \
            || { echo "::error::Expected exactly one GROUPS_PHASE declaration in src/config/features.ts, found: ${phases:-none}"; exit 1; }
          phase="$phases"
          case "$phase" in
            off|beta18|public) ;;
            *) echo "::error::Unknown GROUPS_PHASE '$phase'"; exit 1 ;;
          esac
          echo "GROUPS_PHASE=$phase"
          if [ "$phase" != off ]; then
            missing=""
            [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
            [ -n "$SUPABASE_KEY" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY"
            [ -z "$missing" ] \
              || { echo "::error::GROUPS_PHASE is '$phase' but repository variable(s) missing:$missing. Set them, or build with GROUPS_PHASE 'off'."; exit 1; }
            case "$SUPABASE_URL" in
              https://*) ;;
              *) echo "::error::SUPABASE_URL must be an https:// address"; exit 1 ;;
            esac
            # sb_secret_* (new keys) or a JWT whose role is not anon (service_role) is a server key.
            case "$SUPABASE_KEY" in
              sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY is a secret key; use the publishable / anon key"; exit 1 ;;
            esac
            SUPABASE_KEY="$SUPABASE_KEY" python3 - <<'PY'
          import base64, json, os, sys
          parts = os.environ["SUPABASE_KEY"].split(".")
          if len(parts) == 3:
              try:
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              except ValueError:
                  sys.exit("::error::SUPABASE_PUBLISHABLE_KEY looks like a JWT but its payload is unreadable")
              if payload.get("role") != "anon":
                  sys.exit(f"::error::SUPABASE_PUBLISHABLE_KEY is a JWT with role {payload.get('role')!r}; only the anon key may ship")
          PY
            echo "Build $BUILD_NUMBER: group module on (GROUPS_PHASE '$phase'), server $SUPABASE_URL." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build $BUILD_NUMBER: group module off (GROUPS_PHASE 'off'), built without the server address." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "groups_phase=$phase" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

  testflight:
    name: Archive and upload to TestFlight
    needs: gate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # 'off', 'beta18' or 'public', read and checked by the gate job (step "Group module phase").
      GROUPS_PHASE: ${{ needs.gate.outputs.groups_phase }}
    steps:
      - uses: actions/checkout@v4

      # No build may reach App Store Connect with the data controller left as a placeholder
      # (KVKK m.10/a, K-31, K-38): App Store Connect can send any uploaded build to external
      # testing or App Review, whatever started it. The real name and e-mail are
      # not in this public repository (src/strings.ts DATA_CONTROLLER): they come from these
      # secrets and are inlined into the JS bundle by the archive step. Only a manual run with
      # internal_only ticked passes without them, and says so in the run summary.
      - name: Data controller set
        env:
          INTERNAL_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.internal_only }}
          DC_NAME: ${{ secrets.DATA_CONTROLLER_NAME }}
          DC_CONTACT: ${{ secrets.DATA_CONTROLLER_CONTACT }}
        run: |
          missing=""
          for name in DC_NAME DC_CONTACT; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            if [ "$INTERNAL_ONLY" = "true" ]; then
              echo "::warning::Data controller secrets missing:$missing. Internal TestFlight only: do NOT add build $BUILD_NUMBER to an external group or submit it for review."
              echo "Build $BUILD_NUMBER: internal TestFlight only (data controller placeholders). Never send it to external testing or App Review." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Data controller secrets missing:$missing (DATA_CONTROLLER_NAME / _CONTACT). Set them, or run manually with internal_only for internal testing."
              exit 1
            fi
          fi

      - name: Toolchain
        run: |
          xcodebuild -version
          current="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          lowest="$(printf '%s\n%s\n' "$MIN_XCODE" "$current" | sort -V | head -1)"
          if [ "$lowest" != "$MIN_XCODE" ]; then
            echo "::warning::Xcode $current is older than $MIN_XCODE required by Expo SDK 57. Available:"
            ls -d /Applications/Xcode*.app || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install xcbeautify
        run: brew list xcbeautify > /dev/null 2>&1 || brew install xcbeautify

      # Continuous Native Generation: ios/ is rebuilt from app.json on every run.
      - name: Generate iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      # Expo derives the Xcode project name from app.json "name" with non-ASCII letters removed
      # ("Etüt" -> "Ett"), so the name is discovered instead of hard-coded.
      - name: Locate project and set build number
        run: |
          project="$(ls -d ios/*.xcodeproj | head -1)"
          [ -n "$project" ] || { echo "::error::expo prebuild produced no .xcodeproj"; exit 1; }
          scheme="$(basename "$project" .xcodeproj)"
          workspace="ios/$scheme.xcworkspace"   # created by pod install below
          plist="ios/$scheme/Info.plist"
          [ -f "$plist" ] || { echo "::error::Info.plist not found at $plist"; exit 1; }
          # Expo writes ios.buildNumber as a literal; make the bundle version follow
          # CURRENT_PROJECT_VERSION, which the archive step sets to $BUILD_NUMBER.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion $(CURRENT_PROJECT_VERSION)' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist"
          # Widget/Live Activity extension (expo-widgets): same build number as the app (set by
          # plugins/with-etut-ios.js), App Group on both targets, and no push entitlement.
          ext_dir="ios/ExpoWidgetsTarget"
          [ -f "$ext_dir/Info.plist" ] || { echo "::error::Widget extension Info.plist missing ($ext_dir)"; exit 1; }
          ext_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ext_dir/Info.plist")"
          [ "$ext_version" = '$(CURRENT_PROJECT_VERSION)' ] \
            || { echo "::error::$ext_dir/Info.plist CFBundleVersion is '$ext_version', expected \$(CURRENT_PROJECT_VERSION)"; exit 1; }
          for ent in "ios/$scheme/$scheme.entitlements" "$ext_dir/ExpoWidgetsTarget.entitlements"; do
            [ -f "$ent" ] || { echo "::error::Entitlements file missing: $ent"; exit 1; }
            echo "$ent:"; plutil -p "$ent"
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$ent" | grep -qx '[[:space:]]*group.com.bnycftc.etut' \
              || { echo "::error::$ent lacks the App Group group.com.bnycftc.etut"; exit 1; }
            if /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ent" > /dev/null 2>&1; then
              echo "::error::$ent contains aps-environment; Etüt uses no push (see plugins/with-etut-ios.js)"; exit 1
            fi
          done
          # With the group module on, the app reads Apple's Declared Age Range (K-17, expo-age-range):
          # the app target needs that entitlement. Without the module it is not required.
          if [ "$GROUPS_PHASE" != off ]; then
            ent="ios/$scheme/$scheme.entitlements"
            [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' "$ent" 2>/dev/null)" = true ] \
              || { echo "::error::GROUPS_PHASE is '$GROUPS_PHASE' but $ent lacks com.apple.developer.declared-age-range = true (K-17)"; exit 1; }
          fi
          # Privacy manifests (app.json ios.privacyManifests, plugins/with-etut-ios.js): both declare
          # the App Group UserDefaults reason 1C8F.1; the extension's is in its own Resources phase.
          for manifest in "ios/$scheme/PrivacyInfo.xcprivacy" "$ext_dir/PrivacyInfo.xcprivacy"; do
            [ -f "$manifest" ] || { echo "::error::Privacy manifest missing: $manifest"; exit 1; }
            plutil -p "$manifest" | grep -q '1C8F\.1' || { echo "::error::$manifest lacks the UserDefaults reason 1C8F.1"; exit 1; }
          done
          {
            echo "WORKSPACE=$workspace"
            echo "SCHEME=$scheme"
          } >> "$GITHUB_ENV"
          echo "Workspace: $workspace, scheme: $scheme"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install
          [ -d "../$WORKSPACE" ] || { echo "::error::pod install did not create $WORKSPACE"; exit 1; }

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          key_dir="$HOME/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"          # raw multi-line .p8
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key_path"   # base64 of the .p8
          fi
          chmod 600 "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || { echo "::error::ASC_PRIVATE_KEY is not a .p8 key"; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install stored distribution certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$DIST_CERT_P12_BASE64" ]; then
            echo "::warning::DIST_CERT_P12_BASE64 is not set; export falls back to cloud-managed signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Keep the login keychain in the search list: the archive step stores its development identity there.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q '"Apple Distribution: ' \
            || { echo "::error::DIST_CERT_P12_BASE64 contains no Apple Distribution identity"; exit 1; }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive (Release, automatic signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Inlined by Metro into the JS bundle (the "Bundle React Native code" phase of the archive).
          EXPO_PUBLIC_DATA_CONTROLLER_NAME: ${{ secrets.DATA_CONTROLLER_NAME }}
          EXPO_PUBLIC_DATA_CONTROLLER_CONTACT: ${{ secrets.DATA_CONTROLLER_CONTACT }}
          # Server address and publishable key (repository variables, public values) only when the
          # group module is on; with GROUPS_PHASE 'off' the bundle never contains them.
          EXPO_PUBLIC_SUPABASE_URL: ${{ needs.gate.outputs.groups_phase != 'off' && vars.SUPABASE_URL || '' }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ needs.gate.outputs.groups_phase != 'off' && vars.SUPABASE_PUBLISHABLE_KEY || '' }}
        run: |
          set -o pipefail
          if [ "$GROUPS_PHASE" != off ]; then
            [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] && [ -n "$EXPO_PUBLIC_SUPABASE_KEY" ] \
              || { echo "::error::GROUPS_PHASE is '$GROUPS_PHASE' but the server address or key is empty"; exit 1; }
          fi
          mkdir -p build
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Etut.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee build/archive.log | xcbeautify

      # Same options as the upload, but written to disk so the signature is checked before uploading.
      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cp ci/ExportOptions.plist build/ExportOptions-local.plist
          plutil -replace destination -string export build/ExportOptions-local.plist
          xcodebuild -exportArchive \
            -archivePath build/Etut.xcarchive \
            -exportOptionsPlist build/ExportOptions-local.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log | xcbeautify

      # App Store Connect rejects (ITMS-90035) a main binary that is not signed by a distribution
      # certificate or does not satisfy its own designated requirement; check both before uploading.
      - name: Verify distribution signature
        run: |
          ipa="$(ls build/export/*.ipa | head -1)"
          [ -n "$ipa" ] || { echo "::error::No IPA was exported"; exit 1; }
          rm -rf build/ipa && mkdir -p build/ipa
          ditto -x -k "$ipa" build/ipa
          app="$(ls -d build/ipa/Payload/*.app | head -1)"
          codesign -d --verbose=4 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|CDHash)=' || true
          codesign -d -r- "$app" 2>&1 | grep designated || true
          codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p - || true
          codesign --verify --strict --deep --verbose=4 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -m1 '^Authority=' | grep -qE '^Authority=(Apple|iPhone) Distribution: ' \
            || { echo "::error::$app is not signed with a distribution certificate"; exit 1; }
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          echo "Bundle id $bundle_id, build $build_number"
          [ "$bundle_id" = "com.bnycftc.etut" ] || { echo "::error::Unexpected bundle id $bundle_id"; exit 1; }
          [ "$build_number" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion is $build_number, expected $BUILD_NUMBER"; exit 1; }
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"

          # Signed entitlements: App Group on the app and every extension, never aps-environment.
          check_entitlements() {
            local target="$1" ent="$RUNNER_TEMP/entitlements-$(basename "$1").plist"
            codesign -d --entitlements - --xml "$target" > "$ent" 2>/dev/null || true
            [ -s "$ent" ] || { echo "::error::Could not read the entitlements of $target"; exit 1; }
            plutil -p "$ent"
            /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$ent" | grep -qx '[[:space:]]*group.com.bnycftc.etut' \
              || { echo "::error::$target is not signed with the App Group group.com.bnycftc.etut"; exit 1; }
            if /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ent" > /dev/null 2>&1; then
              echo "::error::$target is signed with aps-environment (push is not used)"; exit 1
            fi
          }
          check_entitlements "$app"
          # Group module on: the app (not its extensions) is signed with Declared Age Range (K-17).
          if [ "$GROUPS_PHASE" != off ]; then
            [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' "$RUNNER_TEMP/entitlements-$(basename "$app").plist" 2>/dev/null)" = true ] \
              || { echo "::error::GROUPS_PHASE is '$GROUPS_PHASE' but $app is not signed with com.apple.developer.declared-age-range (K-17)"; exit 1; }
          fi

          # Privacy manifest of the app and of every extension (ITMS-91053 "Missing API declaration"):
          # each bundle declares the App Group UserDefaults reason 1C8F.1.
          check_privacy_manifest() {
            local manifest="$1/PrivacyInfo.xcprivacy"
            [ -f "$manifest" ] || { echo "::error::$1 has no PrivacyInfo.xcprivacy"; exit 1; }
            echo "$manifest:"; plutil -p "$manifest"
            plutil -p "$manifest" | grep -q '1C8F\.1' || { echo "::error::$manifest lacks the UserDefaults reason 1C8F.1"; exit 1; }
          }
          check_privacy_manifest "$app"

          # App extensions (the expo-widgets Home Screen widget + Live Activity): each must be signed
          # for distribution on its own, live under the app's bundle id and carry the app's versions.
          extensions=0
          for appex in "$app"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            extensions=$((extensions + 1))
            echo "Extension: $appex"
            codesign -d --verbose=4 "$appex" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)=' || true
            codesign --verify --strict --verbose=4 "$appex"
            codesign -d --verbose=2 "$appex" 2>&1 | grep -m1 '^Authority=' | grep -qE '^Authority=(Apple|iPhone) Distribution: ' \
              || { echo "::error::$appex is not signed with a distribution certificate"; exit 1; }
            ext_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")"
            ext_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$appex/Info.plist")"
            ext_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$appex/Info.plist")"
            echo "Extension bundle id $ext_id, version $ext_version, build $ext_build"
            case "$ext_id" in
              com.bnycftc.etut.*) ;;
              *) echo "::error::Extension bundle id $ext_id is not under com.bnycftc.etut"; exit 1 ;;
            esac
            [ "$ext_build" = "$BUILD_NUMBER" ] || { echo "::error::$ext_id CFBundleVersion is $ext_build, expected $BUILD_NUMBER"; exit 1; }
            [ "$ext_version" = "$app_version" ] || { echo "::error::$ext_id version $ext_version differs from the app's $app_version"; exit 1; }
            check_entitlements "$appex"
            check_privacy_manifest "$appex"
          done
          [ "$extensions" -ge 1 ] || { echo "::error::No app extension found; the widget extension (ExpoWidgetsTarget) is missing"; exit 1; }
          echo "Verified app + $extensions extension(s)." >> "$GITHUB_STEP_SUMMARY"

      # When the secrets are set, the e-mail must really be in the shipped bundle (otherwise the app
      # would show the placeholder). Only a count is printed, never the value.
      - name: Verify data controller in the bundle
        env:
          DC_CONTACT: ${{ secrets.DATA_CONTROLLER_CONTACT }}
        run: |
          if [ -z "$DC_CONTACT" ]; then echo "No data controller secrets: the build shows the placeholder."; exit 0; fi
          ipa="$(ls build/export/*.ipa | head -1)"
          hits="$(unzip -p "$ipa" 'Payload/*.app/main.jsbundle' | LC_ALL=C grep -a -c -F "$DC_CONTACT" || true)"
          [ "${hits:-0}" -ge 1 ] || { echo "::error::The data controller e-mail is not in main.jsbundle; EXPO_PUBLIC_DATA_CONTROLLER_* did not reach the bundle"; exit 1; }
          echo "Data controller inlined into the JS bundle (found $hits time(s))." >> "$GITHUB_STEP_SUMMARY"

      # The server address is in the shipped bundle exactly when the group module is on. It is a
      # public value (repository variable), so the address may be printed.
      - name: Verify server address in the bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            [ "$GROUPS_PHASE" = off ] || { echo "::error::GROUPS_PHASE is '$GROUPS_PHASE' but SUPABASE_URL is empty"; exit 1; }
            echo "No SUPABASE_URL variable: nothing to look for (GROUPS_PHASE 'off')."; exit 0
          fi
          ipa="$(ls build/export/*.ipa | head -1)"
          hits="$(unzip -p "$ipa" 'Payload/*.app/main.jsbundle' | LC_ALL=C grep -a -c -F "$SUPABASE_URL" || true)"
          if [ "$GROUPS_PHASE" = off ]; then
            [ "${hits:-0}" -eq 0 ] || { echo "::error::GROUPS_PHASE is 'off' but $SUPABASE_URL is in main.jsbundle"; exit 1; }
            echo "Server address not in the JS bundle (GROUPS_PHASE 'off')." >> "$GITHUB_STEP_SUMMARY"
          else
            [ "${hits:-0}" -ge 1 ] || { echo "::error::$SUPABASE_URL is not in main.jsbundle; EXPO_PUBLIC_SUPABASE_* did not reach the bundle"; exit 1; }
            echo "Server address $SUPABASE_URL inlined into the JS bundle (GROUPS_PHASE '$GROUPS_PHASE')." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Etut.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/upload.log | xcbeautify
          echo "Uploaded Etüt build $BUILD_NUMBER. It appears in TestFlight after App Store Connect finishes processing." >> "$GITHUB_STEP_SUMMARY"

      # xcodebuild writes the detailed export log (codesign calls, chosen certificate) to
      # $TMPDIR/*.xcdistributionlogs; keep it with the other failure artifacts.
      - name: Collect distribution logs
        if: failure()
        run: |
          mkdir -p build
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' -exec cp -R {} build/ \; || true

      # The archive step's environment holds the data controller's name and e-mail
      # (secrets, kept out of this public repository), and Xcode writes the environment of every
      # script phase into the raw log ("export NAME\=value", spaces escaped with a backslash).
      # GitHub masks secrets in the console only, not inside uploaded files: replace the values
      # before the upload. Prints file names and counts, never a value.
      - name: Scrub data controller from logs
        id: scrub
        if: failure()
        env:
          DC_NAME: ${{ secrets.DATA_CONTROLLER_NAME }}
          DC_CONTACT: ${{ secrets.DATA_CONTROLLER_CONTACT }}
        run: |
          python3 - <<'PY'
          import glob, os, re
          values = [os.environ.get(k, "") for k in ("DC_NAME", "DC_CONTACT")]
          # Each value whole and each of its lines, longest first, with an optional backslash before
          # every character.
          parts = sorted({p.strip() for v in values for p in [v, *v.splitlines()] if len(p.strip()) >= 3}, key=len, reverse=True)
          patterns = [re.compile(r"\\?".join(re.escape(ch) for ch in p)) for p in parts]
          env_line = re.compile(r"(EXPO_PUBLIC_DATA_CONTROLLER_[A-Z]+\\?=).*")
          files = glob.glob("build/*.log") + glob.glob("build/*.xcdistributionlogs/**/*", recursive=True)
          for path in filter(os.path.isfile, files):
              with open(path, encoding="utf-8", errors="surrogateescape") as f:
                  text = f.read()
              text, hits = env_line.subn(lambda m: m.group(1) + "[scrubbed]", text)
              for pattern in patterns:
                  text, n = pattern.subn("[scrubbed]", text)
                  hits += n
              if hits:
                  with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                      f.write(text)
                  print(f"{path}: {hits} replacement(s)")
          PY

      # The repository is public, so artifacts are downloadable by anyone signed in to GitHub:
      # upload logs only (scrubbed above), never the signed archive or IPA.
      # Only after a successful scrub: a log that could not be scrubbed is never uploaded.
      - name: Upload logs
        if: failure() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-failure-${{ github.run_number }}
          path: |
            build/archive.log
            build/export.log
            build/upload.log
            build/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Revoke CI development certificates
        # Automatic signing creates an "Apple Development: Created via API" certificate on every fresh
        # runner; its private key dies with the runner. Revoke them so the account never hits Apple's
        # certificate limit. Distribution certificates are never touched.
        if: always()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -n "${ASC_KEY_PATH:-}" ] && [ -f "$ASC_KEY_PATH" ] || { echo "API key not installed; nothing to revoke"; exit 0; }
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import json, os, time, urllib.request, jwt
          key = open(os.environ["ASC_KEY_PATH"]).read()
          def auth():
              now = int(time.time())
              token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600,
                                  "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                                 headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
              return {"Authorization": "Bearer " + token}
          base = "https://api.appstoreconnect.apple.com/v1/certificates"
          req = urllib.request.Request(base + "?limit=200&filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT"
                                       "&fields[certificates]=displayName,name,certificateType", headers=auth())
          for cert in json.load(urllib.request.urlopen(req, timeout=30))["data"]:
              attrs = cert["attributes"]
              if (attrs.get("displayName") or attrs.get("name")) != "Created via API":
                  continue
              delete = urllib.request.Request(base + "/" + cert["id"], method="DELETE", headers=auth())
              urllib.request.urlopen(delete, timeout=30)
              print("revoked CI development certificate", cert["id"])
          PY

      - name: Remove API key and signing keychain
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
