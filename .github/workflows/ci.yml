name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, doctor, iOS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # eslint.config.js: eslint-plugin-react-hooks only (rules of hooks and the React Compiler's
      # checks), every rule a warning. Reported in the log, never fails the job.
      - name: Lint (react-hooks, warnings only)
        continue-on-error: true
        run: npm run lint

      # Two Jest projects (package.json): "unit" runs the tests with jest-expo's transform,
      # "react-compiler" runs app-smoke and app-real-storage again with the React Compiler applied
      # to the app's code, as in the bundles (scripts/jest-react-compiler.js).
      - name: Unit tests
        run: npx jest --ci

      # scripts/store-compose.mjs (framed App Store screenshots): fonts, captions, output format.
      - name: Store frame composer
        run: npm run test:store-compose

      - name: Expo doctor
        run: npx --yes expo-doctor

      # The bundle the device runs: the React Compiler (app.json) over all screens and the
      # expo-widgets transform of the 'widget' layouts, which Jest sees only in part (the
      # "react-compiler" project, src/system/__tests__/widget-free-identifiers.test.ts).
      - name: Export the iOS bundle
        run: npx expo export --platform ios --source-maps --output-dir dist

      # Hakkında → Lisanslar lists the npm packages in that bundle at their installed versions.
      - name: Licence list up to date
        run: |
          node scripts/gen-licenses.mjs dist
          if ! git diff --exit-code -- src/legal/licenses.ts; then
            echo "::error::src/legal/licenses.ts is out of date: run npm run gen:licenses and commit it"
            exit 1
          fi

  web:
    # scripts/test-web.mjs: the real app, React Compiler included, in headless Chromium on its own
    # Expo web dev server. A job of its own, so a slow web run does not hold up the checks above.
    name: Web smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Web smoke test
        run: npm run test:web

      - name: Upload screenshots and dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-web-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/web
          if-no-files-found: ignore
          retention-days: 7
