name: Data controller secret check

# Checks that DATA_CONTROLLER_CONTACT is a plain e-mail address, the same rule as
# contactEmail() in src/domain/contact.ts; otherwise Hakkında shows "E-posta · Yakında".
# Prints only yes/no, never the value.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check format
        env:
          DC_NAME: ${{ secrets.DATA_CONTROLLER_NAME }}
          DC_CONTACT: ${{ secrets.DATA_CONTROLLER_CONTACT }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          name = os.environ.get("DC_NAME", "").strip()
          contact = os.environ.get("DC_CONTACT", "").strip()
          email = re.fullmatch(r'[^\s@<>()\[\]\\,;:"?&=/]+@[^\s@<>()\[\]\\,;:"?&=/]+\.[A-Za-z]{2,}', contact)
          print(f"name set: {'yes' if name else 'no'}")
          print(f"contact is a plain e-mail: {'yes' if email else 'no'}")
          sys.exit(0 if name and email else 1)
          PY
