name: ASC submit for review

# Attaches a processed TestFlight build to the editable App Store version and submits it for
# App Review. Dry run by default: it only checks and prints what is missing. Never changes
# metadata, prices, availability or App Privacy (asc-metadata.yml and App Store Connect do that).
on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version string (e.g. 0.4.0)
        required: true
      build:
        description: Build number to submit (e.g. 17.1)
        required: true
      setup:
        description: Before submitting, fill the review contact (data controller name and e-mail, REVIEW_PHONE), set the price to free and availability to Türkiye only
        type: boolean
        default: false
      apply:
        description: Write (setup if chosen, attach the build, submit); false = dry run, checks only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Review notes come from the release branch of the version being submitted.
      - uses: actions/checkout@v4
        with:
          ref: release/${{ inputs.version }}
      - name: Check and submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          APPLY: ${{ inputs.apply }}
          SETUP: ${{ inputs.setup }}
          # Contact: name and e-mail of the data controller (bny), phone from its own secret.
          DC_NAME: ${{ secrets.DATA_CONTROLLER_NAME }}
          DC_CONTACT: ${{ secrets.DATA_CONTROLLER_CONTACT }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import base64, os, sys, time, jwt, requests

          APP = "6818980777"
          API = "https://api.appstoreconnect.apple.com/v1"
          API2 = "https://api.appstoreconnect.apple.com/v2"
          SETUP = os.environ.get("SETUP") == "true"
          VERSION, BUILD = os.environ["VERSION"].strip(), os.environ["BUILD"].strip()
          APPLY = os.environ.get("APPLY") == "true"
          print("mode:", "APPLY (attach build + submit)" if APPLY else "DRY RUN (checks only)")
          print(f"target: version {VERSION}, build {BUILD}")

          raw = os.environ["ASC_PRIVATE_KEY"]
          key = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          http = requests.Session()
          http.headers["Authorization"] = "Bearer " + token

          def errors(r):
              try:
                  return [(e.get("code"), e.get("title"), e.get("detail")) for e in r.json().get("errors", [])]
              except ValueError:
                  return []

          def call(method, path, body=None, params=None, ok_404=False, v2=False):
              r = http.request(method, (API2 if v2 else API) + path, json=body, params=params, timeout=30)
              if ok_404 and r.status_code == 404:
                  return None
              if not r.ok:
                  sys.exit(f"{method} {path} HTTP {r.status_code} errors: {errors(r)}")
              return r.json() if r.content else {}

          missing = []

          # ---- App Store version ----
          versions = call("GET", f"/apps/{APP}/appStoreVersions",
                          params={"filter[versionString]": VERSION, "filter[platform]": "IOS"})["data"]
          if len(versions) != 1:
              sys.exit(f"expected one App Store version {VERSION}, found {len(versions)}")
          ver = versions[0]
          state = ver["attributes"].get("appStoreState") or ver["attributes"].get("appVersionState")
          print(f"version {VERSION}: state {state}")
          if state not in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED",
                           "READY_FOR_REVIEW"):
              sys.exit(f"version {VERSION} is not editable (state {state})")

          # ---- Build ----
          builds = call("GET", "/builds", params={
              "filter[app]": APP, "filter[version]": BUILD, "filter[preReleaseVersion.version]": VERSION,
              "filter[processingState]": "VALID", "limit": 5})["data"]
          if len(builds) != 1:
              sys.exit(f"expected one VALID build {BUILD} of {VERSION}, found {len(builds)}")
          build = builds[0]
          ba = build["attributes"]
          print(f"build {BUILD}: VALID, expired={ba.get('expired')}, usesNonExemptEncryption={ba.get('usesNonExemptEncryption')}")
          if ba.get("expired"):
              missing.append("build has expired")
          if ba.get("usesNonExemptEncryption") is None:
              missing.append("export compliance (usesNonExemptEncryption) not set on the build")

          current = call("GET", f"/appStoreVersions/{ver['id']}/relationships/build").get("data")
          print("attached build:", "this build" if current and current["id"] == build["id"] else ("another build" if current else "none"))

          # ---- Review details (values never printed) ----
          rd = call("GET", f"/appStoreVersions/{ver['id']}/appStoreReviewDetail", ok_404=True)
          rda = (rd or {}).get("data") or {}
          rda = rda.get("attributes", {}) if rda else {}
          for f in ("contactFirstName", "contactLastName", "contactPhone", "contactEmail"):
              ok = bool((rda.get(f) or "").strip())
              print(f"review contact {f}: {'set' if ok else 'MISSING'}")
              if not ok:
                  missing.append(f"App Review contact {f}")
          print(f"review notes: {'set' if (rda.get('notes') or '').strip() else 'empty'}")

          # ---- Availability ----
          avail = call("GET", f"/apps/{APP}/appAvailabilityV2", ok_404=True)
          if avail and avail.get("data"):
              terr = call("GET", f"/appAvailabilities/{avail['data']['id']}/territoryAvailabilities",
                          params={"limit": 200, "include": "territory"}, v2=True)
              on = [t["relationships"]["territory"]["data"]["id"] for t in terr["data"]
                    if t["attributes"].get("available")]
              print(f"available territories: {len(on)}{' (TUR)' if on == ['TUR'] else ''}: {', '.join(sorted(on)[:10])}")
              if "TUR" not in on:
                  missing.append("availability: Türkiye (TUR) not available")
          else:
              print("availability: not set")
              missing.append("availability not set")
          sched = call("GET", f"/apps/{APP}/appPriceSchedule", ok_404=True,
                       params={"include": "manualPrices,baseTerritory"})
          sdata = (sched or {}).get("data") or {}
          base = (((sdata.get("relationships") or {}).get("baseTerritory") or {}).get("data") or {}).get("id")
          manual = ((sdata.get("relationships") or {}).get("manualPrices") or {}).get("data") or []
          has_price = bool(base and manual)
          print(f"price schedule: {'set, base ' + base if has_price else 'not set'}")
          if has_price:
              pts = call("GET", f"/apps/{APP}/appPricePoints", params={"filter[territory]": base, "limit": 200})["data"]
              by_id = {p["id"]: p["attributes"].get("customerPrice") for p in pts}
              mp_ids = [m["id"] for m in manual]
              inc = [i for i in sched.get("included", []) if i["type"] == "appPrices" and i["id"] in mp_ids]
              prices = sorted({by_id.get(((i.get("relationships") or {}).get("appPricePoint") or {}).get("data", {}).get("id"), "?")
                               for i in inc})
              print(f"manual prices (customer price): {prices}")
              if prices and any(x not in ("0", "0.0", "0.00") for x in prices):
                  missing.append("price is not free")
          else:
              missing.append("price not set")

          # ---- Setup: contact, free price, Türkiye only ----
          if SETUP:
              name = os.environ.get("DC_NAME", "").split()
              contact = {"contactFirstName": " ".join(name[:-1]), "contactLastName": name[-1] if name else "",
                         "contactPhone": os.environ.get("REVIEW_PHONE", "").strip(),
                         "contactEmail": os.environ.get("DC_CONTACT", "").strip()}
              empty = [k for k, v in contact.items() if not v]
              if empty:
                  sys.exit("setup: missing " + ", ".join(empty) + " (DATA_CONTROLLER_NAME / _CONTACT, REVIEW_PHONE secrets)")
              notes = open("store/app-store/review-notes.txt", encoding="utf-8").read().strip()
              free = [p for p in call("GET", f"/apps/{APP}/appPricePoints",
                                      params={"filter[territory]": "TUR", "limit": 200})["data"]
                      if float(p["attributes"].get("customerPrice") or "1") == 0.0]
              if len(free) != 1:
                  sys.exit(f"setup: expected one free price point for TUR, found {len(free)}")
              print("setup: contact from secrets (4 fields), notes from release branch, free price, TUR only")
              if APPLY:
                  attrs = dict(contact, notes=notes, demoAccountRequired=False)
                  if rd and rd.get("data"):
                      call("PATCH", f"/appStoreReviewDetails/{rd['data']['id']}", {"data": {
                          "type": "appStoreReviewDetails", "id": rd["data"]["id"], "attributes": attrs}})
                  else:
                      call("POST", "/appStoreReviewDetails", {"data": {"type": "appStoreReviewDetails",
                           "attributes": attrs, "relationships": {"appStoreVersion": {"data": {
                               "type": "appStoreVersions", "id": ver["id"]}}}}})
                  print("setup: review contact and notes written")
                  if not has_price:
                      call("POST", "/appPriceSchedules", {"data": {"type": "appPriceSchedules", "relationships": {
                          "app": {"data": {"type": "apps", "id": APP}},
                          "baseTerritory": {"data": {"type": "territories", "id": "TUR"}},
                          "manualPrices": {"data": [{"type": "appPrices", "id": "${price1}"}]}}},
                          "included": [{"type": "appPrices", "id": "${price1}", "attributes": {"startDate": None},
                                        "relationships": {"appPricePoint": {"data": {
                                            "type": "appPricePoints", "id": free[0]["id"]}}}}]})
                      print("setup: price set to free (base territory TUR)")
                  if not (avail and avail.get("data")):
                      call("POST", "/appAvailabilities", {"data": {"type": "appAvailabilities",
                           "attributes": {"availableInNewTerritories": False},
                           "relationships": {"app": {"data": {"type": "apps", "id": APP}},
                                             "territoryAvailabilities": {"data": [
                                                 {"type": "territoryAvailabilities", "id": "${tur}"}]}}},
                           "included": [{"type": "territoryAvailabilities", "id": "${tur}",
                                         "attributes": {"available": True},
                                         "relationships": {"territory": {"data": {
                                             "type": "territories", "id": "TUR"}}}}]}, v2=True)
                      print("setup: availability set to Türkiye only")
                  missing = [m for m in missing if not m.startswith(("App Review contact", "availability", "price"))]

          print("App Privacy: not readable via the API; it must be published in App Store Connect")

          if missing:
              print("\nMISSING before submission:\n  " + "\n  ".join(missing))
          else:
              print("\nall API-checkable items are ready")
          if not APPLY:
              sys.exit(0)
          if missing:
              sys.exit("not submitting: items missing")

          # ---- Attach + submit ----
          if not (current and current["id"] == build["id"]):
              call("PATCH", f"/appStoreVersions/{ver['id']}/relationships/build",
                   {"data": {"type": "builds", "id": build["id"]}})
              print(f"attached build {BUILD} to {VERSION}")
          sub = call("POST", "/reviewSubmissions", {"data": {"type": "reviewSubmissions",
                     "attributes": {"platform": "IOS"},
                     "relationships": {"app": {"data": {"type": "apps", "id": APP}}}}})["data"]
          call("POST", "/reviewSubmissionItems", {"data": {"type": "reviewSubmissionItems",
               "relationships": {"reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub["id"]}},
                                 "appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver["id"]}}}}})
          done = call("PATCH", f"/reviewSubmissions/{sub['id']}", {"data": {"type": "reviewSubmissions",
                      "id": sub["id"], "attributes": {"submitted": True}}})["data"]
          print(f"submitted for review: state {done['attributes'].get('state')}")
          PY
