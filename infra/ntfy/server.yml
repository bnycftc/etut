# /etc/ntfy/server.yml — operator alert channel (K-28, K-29), installed by 09-ntfy.sh.
# <ETUT_NTFY_HOST> is filled in from /etc/etut/etut.conf. Reference: ntfy.sh/docs/config.
#
# Fully domestic: the server runs here, behind Caddy (bildirim.<alan>), and talks to nobody else.
#   - No upstream (upstream-base-url is NOT set): no poll_request goes to ntfy.sh, so neither
#     ntfy.sh nor Firebase/APNs learns that a message exists. Price: the iOS app is not woken by a
#     push; it shows messages when it polls or is opened. The mail copy is the backup channel.
#   - No web app, no sign-up, no attachments, no e-mail or phone features of ntfy itself.
#   - deny-all: only the `alert` user (write-only) and the `bny` user (read-only) reach the topic.
# alert.sh publishes counts only (no nickname, group name or report id).

base-url: "https://<ETUT_NTFY_HOST>"
# Only on loopback; Caddy is the only way in from outside (healthcheck.sh checks public ports).
listen-http: "127.0.0.1:2586"
behind-proxy: true

# Messages are kept 12 h so a phone that was offline still gets them.
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "12h"

auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"

enable-signup: false
enable-login: false
enable-reservations: false
web-root: "disable"

log-level: info
