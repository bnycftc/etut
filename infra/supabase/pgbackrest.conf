# /etc/etut/pgbackrest/pgbackrest.conf (mounted read-only into the db container).
# Placeholders in <> are filled by 07-backup.sh; the cipher pass is generated there and never
# leaves the server (kept also in the offline password manager of the operator).
[global]
repo1-type=sftp
repo1-sftp-host=<BACKUP_SFTP_HOST>
repo1-sftp-host-port=<BACKUP_SFTP_PORT>
repo1-sftp-host-user=<BACKUP_SFTP_USER>
repo1-sftp-private-key-file=/etc/pgbackrest/id_ed25519
repo1-sftp-host-key-check-type=fingerprint
repo1-sftp-host-fingerprint=<BACKUP_SFTP_FINGERPRINT>
repo1-path=<BACKUP_PGBACKREST_PATH>
# Client-side encryption: the backup box only ever sees ciphertext (hukuk/kvkk/09 §5).
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<PGBACKREST_CIPHER_PASS>
# 30-day cycle (kvkk/09 §7 "Yedekler: 30 gün döngü"): full backups kept 30 days, WAL with them.
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
process-max=2
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
start-fast=y

[etut]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=supabase_admin
