# Etüt overrides on top of the official self-hosted compose (supabase/supabase, tag pinned in
# infra/scripts/03-supabase.sh). Copied next to docker-compose.yml as docker-compose.override.yml.
# Needs Docker Compose >= 2.24 (!override).
services:
  # API gateway (Envoy): only on 127.0.0.1. Caddy forwards /rest/v1 and /auth/v1 to it; Studio
  # (served by the gateway at /) is therefore never reachable from the internet, only through
  # an SSH tunnel: ssh -L 8000:127.0.0.1:8000 etut@<server>, then http://localhost:8000
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000/tcp"

  # Postgres through the pooler: 127.0.0.1 only (SSH tunnel for migrations and admin).
  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  auth:
    environment:
      # Anonymous start, later link Apple / Google (hukuk/kvkk/00 §3.3; no e-mail, no SMS).
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "true"
      GOTRUE_EXTERNAL_APPLE_ENABLED: "true"
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Anonymous sign-ins per IP per hour (GoTrue default 30).
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: "30"

  db:
    # Official image + pgBackRest (infra/supabase/db/Dockerfile) for WAL archiving.
    build:
      context: ./etut/db
      args:
        SUPABASE_POSTGRES_TAG: 17.6.1.136
    image: etut/postgres-pgbackrest:17.6.1.136
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=etut archive-push %p
      - -c
      - archive_timeout=300
    volumes:
      - /etc/etut/pgbackrest:/etc/pgbackrest:ro
      - /var/lib/etut/pgbackrest-spool:/var/spool/pgbackrest
      - /var/log/etut/pgbackrest:/var/log/pgbackrest
